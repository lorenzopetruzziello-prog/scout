<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123E78" id="themeColor">
<meta name="description" content="Scout dell'attacco nella pallavolo: le avversarie, la tua squadra e cosa dire al timeout.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scout">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Scout</title>
<link rel="preload" href="fonts/big-shoulders.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/archivo.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app" data-ground="L">
<header class="appbar">
  <div class="bar-row">
    <button class="matchbtn" id="matchBtn" aria-haspopup="dialog"><span class="mb"><span class="mk" id="mbKick">Partita</span><span class="mn" id="matchName">Nuova partita</span></span><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.5L8 10.5l4-4"/></svg></button>
    <div class="sets" id="sets" role="group" aria-label="Set in corso"><i class="pill" aria-hidden="true"></i><button data-set="1" aria-pressed="true" aria-label="Set 1">1</button><button data-set="2" aria-pressed="false" aria-label="Set 2">2</button><button data-set="3" aria-pressed="false" aria-label="Set 3">3</button><button data-set="4" aria-pressed="false" aria-label="Set 4">4</button><button data-set="5" aria-pressed="false" aria-label="Set 5, tie-break">5</button></div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Sezioni">
    <i class="ind" aria-hidden="true"></i>
    <button role="tab" id="t-scout" data-v="scout" aria-selected="true" aria-controls="v-scout">Scout</button>
    <button role="tab" id="t-tips" data-v="tips" aria-selected="false" aria-controls="v-tips" tabindex="-1">Indicazioni</button>
    <button role="tab" id="t-team" data-v="team" aria-selected="false" aria-controls="v-team" tabindex="-1">Squadra</button>
    <button role="tab" id="t-data" data-v="data" aria-selected="false" aria-controls="v-data" tabindex="-1">Dati</button>
  </nav>
</header>

<main id="main">
  <section class="view scout" id="v-scout" role="tabpanel" aria-labelledby="t-scout" data-side="L">
    <div class="sc-side">
      <div class="sideswitch" id="sideSw" role="radiogroup" aria-label="Chi sta attaccando">
        <i class="knob" aria-hidden="true"></i>
        <button role="radio" data-side="L" aria-checked="true"><i aria-hidden="true"></i><span id="swL">Attaccano loro</span></button>
        <button role="radio" data-side="N" aria-checked="false" tabindex="-1"><i aria-hidden="true"></i><span id="swN">Attacchiamo noi</span></button>
      </div>
    </div>
    <div class="sc-who">
      <div class="starter" id="starter" hidden><div style="flex:1;min-width:0"><b id="stTitle"></b><p id="stText"></p></div><button class="btn ball" id="starterBtn">Scegli</button></div>
      <div class="jerseys" id="jerseys" role="group" aria-label="Chi attacca"></div>
    </div>
    <div class="sc-court"><div class="court" id="court" role="group" aria-label="Da dove e come"></div></div>
    <div class="sc-dock">
      <div class="status" id="status" aria-live="polite"></div>
      <div class="outs" id="outs" role="group" aria-label="Esito"></div>
      <div class="feed" id="feed"></div>
      <p class="kbd"><kbd>7</kbd> numero <kbd>P</kbd> <kbd>D</kbd> <kbd>M</kbd> <kbd>E</kbd> esito <kbd>L</kbd> <kbd>N</kbd> lato <kbd>Esc</kbd> azzera <kbd>Ctrl</kbd>+<kbd>Z</kbd> annulla <kbd>I</kbd> indicazioni</p>
    </div>
  </section>
  <section class="view" id="v-tips" role="tabpanel" aria-labelledby="t-tips" hidden></section>
  <section class="view" id="v-team" role="tabpanel" aria-labelledby="t-team" hidden></section>
  <section class="view" id="v-data" role="tabpanel" aria-labelledby="t-data" hidden></section>
</main>
</div>
<div class="ground" aria-hidden="true"><i class="gL"></i><i class="gN"></i><i class="gG"></i></div>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"></div></div>
<div class="show" id="show" role="dialog" aria-modal="true" aria-label="Indicazioni a tutto schermo" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastAct" hidden></button></div>
<script src="app.js"></script>
</body>
</html>
