<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4EA2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scout">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Scout attacco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EEF5;--surface:#FFFFFF;--surface2:#F2F6FA;--ink:#0F1D2E;--muted:#586779;--line:#D4DDE8;--link:#1655A8;
  --head:#0B4EA2;--primary:#0B4EA2;--onhead:#FFFFFF;
  --court:#2366B5;--netband:#0F2340;
  --ball:#FFC72C;--ball-ink:#241A00;--ball-edge:#C99700;
  --kill:#D63B3B;--dig:#1C9A5E;--block:#F2BD1D;--err:#8A8F97;--block-ink:#2B2000;
  --calm:#4C82CF;--warn:#E3852A;
  --d-fill:#D5E3F4;--d-fill2:#E7EEF8;--d-line:#FFFFFF;--d-net:#1B2D45;--d-text:#5F7084;
  --toast:#13233A;
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,-apple-system,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08121F;--surface:#101D30;--surface2:#16263D;--ink:#E5EDF7;--muted:#97A7BC;--line:#23364F;--link:#8DB8F2;
  --head:#0C2B55;--primary:#2F6FC4;--court:#1D4E8C;--netband:#050E1A;--ball-edge:#FFC72C;
  --kill:#EF5D57;--dig:#2FB477;--block:#F5C63C;--err:#8C9199;--calm:#5E95E0;--warn:#F0993F;
  --d-fill:#18324F;--d-fill2:#12263E;--d-line:#2F4D73;--d-net:#C7D5E6;--d-text:#8EA0B7;--toast:#243B5C;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#08121F;--surface:#101D30;--surface2:#16263D;--ink:#E5EDF7;--muted:#97A7BC;--line:#23364F;--link:#8DB8F2;
  --head:#0C2B55;--primary:#2F6FC4;--court:#1D4E8C;--netband:#050E1A;--ball-edge:#FFC72C;
  --kill:#EF5D57;--dig:#2FB477;--block:#F5C63C;--err:#8C9199;--calm:#5E95E0;--warn:#F0993F;
  --d-fill:#18324F;--d-fill2:#12263E;--d-line:#2F4D73;--d-net:#C7D5E6;--d-text:#8EA0B7;--toast:#243B5C;
  color-scheme:dark;}

*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:linear-gradient(var(--head) 50%,var(--surface) 50%)}
body{height:100%;margin:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.appbar :focus-visible,.court :focus-visible{outline-color:var(--ball)}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* barra in alto */
.appbar{flex:none;background:var(--head);color:var(--onhead);padding:6px 12px 0}
.bar-row{display:flex;align-items:center;gap:8px;max-width:640px;margin:0 auto;min-height:46px}
.matchbtn{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:0;background:none;color:inherit;padding:6px 6px 6px 2px;border-radius:10px;text-align:left}
.matchbtn .vs{font:500 15px/1 var(--font);opacity:.72;flex:none}
.matchbtn .name{font:700 23px/1.15 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.matchbtn .i{opacity:.75}
.sets{display:flex;align-items:center;gap:2px;flex:none}
.sets .lab{font:500 14px/1 var(--font);opacity:.72;margin-right:3px}
.sets button{width:29px;height:32px;border:0;border-radius:8px;background:rgba(255,255,255,.13);color:var(--onhead);font:700 18px/1 var(--cond)}
.sets button[aria-pressed="true"]{background:var(--ball);color:var(--ball-ink)}
.tabs{display:flex;max-width:640px;margin:2px auto 0}
.tabs button{flex:1 1 auto;border:0;background:none;color:rgba(255,255,255,.7);font:600 clamp(13px,3.9vw,15px)/1 var(--font);white-space:nowrap;padding:12px 6px 10px;border-bottom:3px solid transparent;transition:color .15s}
.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--ball)}
@media (max-width:359px){.sets .lab{display:none}}

/* contenuto */
main{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.view{flex:none;width:100%;max-width:640px;margin:0 auto;padding:14px 12px 32px}
.view.scout{flex:1 0 auto;display:flex;flex-direction:column;padding:10px 12px 0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.scout-body{flex:1 0 auto}
.bh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 2px 8px}
.bh h2{margin:0;font:600 17px/1.2 var(--cond);color:var(--muted)}
.bh .hint{font-size:13px;color:var(--muted);text-align:right}
.linkbtn{border:0;background:none;color:var(--link);font:600 15px/1 var(--font);padding:6px 2px}

.starter{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px;margin-bottom:12px}
.starter b{font:700 18px/1.2 var(--cond)}
.starter p{margin:2px 0 0;font-size:14px;color:var(--muted);line-height:1.35}
.starter .btn{flex:none}

/* maglie */
.jerseys{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin-bottom:14px}
.jersey{position:relative;height:54px;border:0;background:none;padding:0;color:var(--ink);border-radius:12px;display:flex;justify-content:center}
.shirt{width:60px;height:53px;overflow:visible;display:block}
.shirt path{fill:var(--surface);stroke:var(--line);stroke-width:1.6;stroke-linejoin:round;transition:fill .12s,stroke .12s}
.jersey .num{position:absolute;left:0;right:0;top:20px;text-align:center;font:700 22px/1 var(--cond);pointer-events:none}
.jersey[aria-pressed="true"] .shirt path{fill:var(--ball);stroke:var(--ball-edge)}
.jersey[aria-pressed="true"] .num{color:var(--ball-ink)}
.jersey.unknown .shirt path,.jersey.add .shirt path{fill:transparent;stroke-dasharray:3.5 3}
.jersey.unknown[aria-pressed="true"] .shirt path{fill:var(--ball)}
.jersey.add .num{color:var(--link);font-weight:600;font-size:25px;top:18px}
.jersey .cnt{position:absolute;top:-3px;left:calc(50% + 14px);min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--primary);color:#fff;font:700 12.5px/19px var(--cond);text-align:center;box-shadow:0 0 0 2px var(--bg)}
.jersey .cnt.hot{background:var(--kill)}

/* campo per segnare */
.court{position:relative;background:radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.13),transparent 60%),repeating-linear-gradient(90deg,rgba(255,255,255,.028) 0 2px,transparent 2px 9px),linear-gradient(180deg,var(--court),color-mix(in srgb,var(--court) 78%,#000));border-radius:14px;padding:0 6px 6px;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.92),0 10px 24px -12px rgba(8,30,70,.55);overflow:hidden;margin-bottom:12px}
.net{position:relative;height:14px;box-shadow:inset 0 3px 0 #fff;margin:0 -6px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.2) 0 1px,transparent 1px 5px),repeating-linear-gradient(-45deg,rgba(255,255,255,.2) 0 1px,transparent 1px 5px),var(--netband);border-bottom:3px solid #fff}
.front{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.zone{display:flex;flex-direction:column;gap:7px;padding:6px 4px 8px;min-width:0}
.front .zone+.zone{border-left:1.5px dashed rgba(255,255,255,.32)}
.zhead{display:flex;align-items:baseline;gap:6px;padding:0 3px 1px;white-space:nowrap}
.zhead b{font:700 22px/1 var(--cond)}
.zhead span{font:500 13px/1 var(--font);opacity:.8}
.back{position:relative;display:grid;grid-template-columns:1fr 1fr;border-top:2px solid #fff;margin:4px -6px 0;padding:10px 4px 2px}
.bgrp{min-width:0;padding:0 4px}.bgrp+.bgrp{border-left:1.5px dashed rgba(255,255,255,.32)}
.bgrp .zhead{padding-bottom:6px}
.l3{position:absolute;top:-9px;left:50%;transform:translateX(-50%);padding:0 8px;background:var(--court);border-radius:6px;font:600 11px/16px var(--font);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;opacity:.85}
.brow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.shot.bk{justify-content:center;gap:3px;padding:0 3px}
.shot.bk .lab{flex:none;overflow:visible;font:700 20px/1 var(--cond)}
.court.fit-ic .shot.bk .lab{display:inline}
.shot{position:relative;display:flex;align-items:center;gap:6px;min-height:40px;padding:0 8px;border-radius:9px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;font-family:var(--cond);font-weight:600;line-height:1;font-size:var(--shot-fs,15.5px);text-align:left;transition:background .12s,color .12s,border-color .12s,transform .08s}
.si{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.shot .lab{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot .sh,.shot .xs{display:none}
.shot:active{transform:scale(.97)}
.shot[aria-pressed="true"]{background:var(--ball);border-color:var(--ball);color:var(--ball-ink)}
.tally{position:absolute;top:-6px;right:-4px;z-index:1;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#fff;color:#0B4EA2;font:700 12.5px/19px var(--cond);text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.28)}
.tally.hot{background:var(--kill);color:#fff}
.tally:empty{display:none}
.court.fit-sh .lg{display:none}.court.fit-sh .sh{display:inline}
.court.fit-xs .lg,.court.fit-xs .sh{display:none}.court.fit-xs .xs{display:inline}
.court.fit-ic .lab{display:none}.court.fit-ic .shot{justify-content:center}
@media (max-width:359px){.shot{padding:0 6px;gap:4px}.zhead span{display:none}}

/* esiti in basso */
.dock{position:sticky;bottom:0;z-index:3;margin:0 -12px;padding:8px 12px 12px;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -10px 24px rgba(12,32,64,.07)}
.status{position:relative;isolation:isolate;display:flex;align-items:center;gap:2px;height:46px;margin-bottom:8px;padding:0 2px 0 10px;border-radius:11px;font-size:14px;line-height:1.25}
.status::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--flash,transparent);opacity:.14}
.status .txt{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.status .txt .i{display:inline-block;vertical-align:-3px;margin-right:5px;color:var(--dig)}
.status b{font-weight:600}
.status .muted{color:var(--muted)}
.act{flex:none;display:inline-flex;align-items:center;gap:5px;border:0;background:none;color:var(--link);font:600 15px/1 var(--font);padding:10px 8px;border-radius:9px}
.act.hist{color:var(--muted);font:700 16px/1 var(--cond)}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{position:relative;min-height:56px;border:0;border-radius:13px;color:#fff;font:600 clamp(16px,5vw,20px)/1.1 var(--cond);white-space:nowrap;letter-spacing:.01em;transition:transform .08s,box-shadow .15s}
.out:active{transform:scale(.98)}
.out.K{background:var(--kill)}.out.D{background:var(--dig)}.out.B{background:var(--block);color:var(--block-ink)}.out.E{background:var(--err)}
.out[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--ink)}

@media (max-height:760px){
  .view.scout{padding-top:8px}
  .bh{margin-bottom:6px}
  .jersey{height:48px}.shirt{width:54px;height:48px}.jersey .num{top:17px;font-size:20px}.jersey.add .num{top:15px}
  .jerseys{margin-bottom:10px}
  .shot{min-height:36px}.zone{gap:6px;padding:5px 4px 7px}.zhead b{font-size:20px}
  .dock{padding:6px 12px 10px}.status{height:42px;margin-bottom:6px}.out{min-height:50px}
}
@media (max-height:700px){.scout .bh{display:none}.view.scout{padding-top:10px}}
@media (max-height:660px){
  .zhead span{display:none}
  .zone{padding:4px 4px 5px;gap:5px}.zhead b{font-size:18px}
  .court{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1.25fr)}
  .net{grid-column:1/-1}
  .back{border-top:0;border-left:2px solid #fff;margin:0 -6px 0 0;padding:4px 3px 5px 3px}
  .bgrp{padding:0 2px}.bgrp+.bgrp{border-left:0}
  .bgrp .zhead{padding:0 0 5px;justify-content:center;min-height:23px;align-items:center}.bgrp .zhead b{font-size:14.5px}
  .back .brow{grid-template-columns:minmax(0,1fr);gap:5px}
  .shot.bk .lab{font-size:17px}.shot.bk .si{width:13px;height:13px}
  .l3{display:none}
  .shot{padding:0 6px;gap:4px}.si{width:15px;height:15px}
}
@media (max-height:600px){
  .appbar{padding-top:4px}.bar-row{min-height:42px}.tabs button{padding:10px 6px 8px}
  .jersey{height:44px}.shirt{width:50px;height:44px}.jersey .num{top:15px;font-size:19px}.jersey.add .num{top:13px}
  .shot{min-height:34px}.out{min-height:46px}.status{height:40px}
}
@media (prefers-reduced-motion:no-preference){
  .jersey[aria-pressed="true"] .shirt{animation:pop .2s ease-out}
  .shot[aria-pressed="true"]{animation:pop .18s ease-out}
  .status.pop .txt{animation:rise .32s ease-out}
  .out.fired{animation:flash .5s ease-out}
  @keyframes pop{from{transform:scale(.9)}to{transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes flash{0%{filter:brightness(1.5)}100%{filter:none}}
}

/* viste di analisi */
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -12px 12px;padding:2px 12px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font:600 14px/1 var(--font);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.sech{margin:24px 2px 10px;font:700 22px/1.15 var(--cond)}
.chips+.sech,.view>.sech:first-child{margin-top:4px}
.sub{margin:0 0 12px;color:var(--muted);font-size:15px}
.tiny{font-size:13px;color:var(--muted);margin:8px 2px 0;line-height:1.4}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:0 2px 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%}
.legend i.bar{width:16px;height:4px;border-radius:2px}

.bj{position:relative;flex:none;display:block;width:64px;height:57px}
.bj .shirt{width:64px;height:57px}
.bj .shirt path{fill:var(--primary);stroke:var(--primary)}
.bj .num{position:absolute;left:0;right:0;top:21px;text-align:center;color:#fff;font:700 25px/1 var(--cond)}
.bj.unknown .shirt path{fill:var(--err);stroke:var(--err)}

.pcard,.threat,.team,.scard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.pc-head,.th-head{display:flex;align-items:center;gap:12px}
.kpis{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.kpis div{min-width:0}
.kpis b{display:block;font:700 26px/1.05 var(--cond)}
.kpis b.kill{color:var(--kill)}
.kpis span{display:block;font-size:12.5px;color:var(--muted);line-height:1.25}
.obar{display:flex;gap:2px;height:9px;border-radius:5px;overflow:hidden;background:var(--line);margin:12px 0 2px}
.obar span{display:block;height:100%}
.obar.mini{height:5px;gap:1px;border-radius:3px;margin:5px 0 0}
.pc-body,.th-body{display:grid;grid-template-columns:minmax(130px,44%) 1fr;gap:14px;align-items:start;margin-top:12px}
.shotlist{list-style:none;margin:0;padding:0}
.shotlist li{padding:7px 0;border-bottom:1px solid var(--line)}
.shotlist li:last-child{border-bottom:0}
.sl-top{display:flex;justify-content:space-between;gap:8px;font-size:14.5px;line-height:1.25}
.sl-top .n{white-space:nowrap;color:var(--muted)}
.sl-top .n b{color:var(--ink);font:700 17px/1 var(--cond)}
.sl-top .n em{font-style:normal;color:var(--kill);font-weight:600}
.caveat{margin:12px 0 0;font-size:13.5px;color:var(--muted);padding:8px 10px;background:var(--surface2);border-radius:9px}

.dg-svg{display:block;width:100%;height:auto;overflow:visible}
.dg-svg .dz{font:600 7.4px var(--font);fill:var(--d-text);text-anchor:middle}
.dg-svg .side{font:600 7px var(--font);fill:var(--d-text);text-anchor:middle}
.dg-svg .dour{fill:var(--d-fill)}
.dg-svg .dthr{fill:var(--d-fill2)}
.dg-svg .dln{stroke:var(--d-line);stroke-width:1.2;fill:none}
.dg-svg .dnet{stroke:var(--d-net);stroke-width:2.6;stroke-linecap:round}
.dg-svg .org circle,.dg-svg .org rect{fill:var(--surface);stroke:var(--d-text);stroke-width:.9}
.dg-svg .org text{font:700 8.2px var(--cond);fill:var(--d-text);text-anchor:middle}
.dg-svg .org.on circle,.dg-svg .org.on rect{fill:var(--primary);stroke:var(--primary)}
.dg-svg .org.on text{fill:#fff}

.th-rank{margin:0;font:600 14px/1.2 var(--font);color:var(--kill)}
.th-big{margin:3px 0 0;font:700 24px/1.1 var(--cond)}
.th-sub{margin:3px 0 0;font-size:14px;color:var(--muted)}
.facts{margin:0}
.facts div{padding:7px 0;border-bottom:1px solid var(--line)}
.facts div:first-child{padding-top:0}
.facts div:last-child{border-bottom:0}
.facts dt{font-size:12.5px;color:var(--muted);line-height:1.2}
.facts dd{margin:2px 0 0;font-weight:600;font-size:15px;line-height:1.3}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.note{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.note .tag{flex:none;min-width:46px;height:30px;padding:0 8px;border-radius:8px;background:var(--primary);color:#fff;font:700 18px/30px var(--cond);text-align:center}
.note.tip .tag{background:var(--warn)}
.note.weak .tag{background:var(--dig)}
.note p{margin:0;font-size:15px;line-height:1.4}
.note p b{display:block;font:700 18px/1.2 var(--cond);margin-bottom:2px}
.team .dg{max-width:260px;margin:2px auto 8px}
.costly{list-style:none;margin:0;padding:0}
.costly li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.3}
.costly li:last-child{border-bottom:0}
.costly .k{flex:none;min-width:26px;font:700 24px/1 var(--cond);color:var(--kill)}
.costly small{display:block;margin-top:2px;color:var(--muted);font-size:13px}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px;white-space:nowrap}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line)}
th{font:600 13px/1.2 var(--font);color:var(--muted)}
th:first-child,td:first-child{text-align:left;padding-left:14px}
th:last-child,td:last-child{padding-right:14px}
tbody tr:last-child td{border-bottom:0}
td .jn{font:700 19px/1 var(--cond)}
td.hot{color:var(--kill);font-weight:700}

function cleanEvent(e){
  if(!e||typeof e!=='object') return null;
  const n=normNum(e.n); if(n===null) return null;
  if(!ZS.includes(e.z)||!DS.includes(e.d)||!OS.includes(e.o)) return null;
  if(!ZD[e.z].includes(e.d)&&!LEGACY.has(e.z+e.d)) return null;
  const s=Math.min(5,Math.max(1,parseInt(e.s,10)||1));
  const t=Number(e.t)>0?Number(e.t):Date.now();
  const id=String(e.id||'').replace(/[^0-9a-z]/gi,'').slice(0,24)||newId();
  return {id,t,n,z:e.z,d:e.d,o:e.o,s};
}
function cleanMatch(m){
  if(!m||typeof m!=='object') return null;
  const out={
    id:String(m.id||'').replace(/[^0-9a-z]/gi,'').slice(0,32)||('m'+newId()),
    opp:String(m.opp||'').slice(0,40),
    date:/^\d{4}-\d{2}-\d{2}$/.test(m.date||'')?m.date:todayISO(),
    set:Math.min(5,Math.max(1,parseInt(m.set,10)||1)),
    roster:[],ev:[],alias:[],gone:[],
    created:Number(m.created)>0?Number(m.created):Date.now()
  };
  if(Array.isArray(m.gone)) out.gone=[...new Set(m.gone.map(g=>String(g).replace(/[^0-9a-z]/gi,'')).filter(Boolean))].slice(-1000);
  const seen=new Set(out.gone);
  (Array.isArray(m.ev)?m.ev:[]).forEach(x=>{ const e=cleanEvent(x); if(e&&!seen.has(e.id)){ seen.add(e.id); out.ev.push(e); } });
  out.ev.sort((a,b)=>a.t-b.t);
  const r=new Set();
  (Array.isArray(m.roster)?m.roster:[]).forEach(x=>{ const n=normNum(x); if(n&&n!=='?') r.add(n); });
  out.roster=[...r].sort(numSort);
  if(Array.isArray(m.alias)) out.alias=m.alias.map(a=>String(a).replace(/[^0-9a-z]/gi,'')).filter(Boolean).slice(0,20);
  return out;
}
const newMatch=opp=>cleanMatch({id:'m'+newId(),opp:opp||'',date:todayISO(),created:Date.now()});

function load(){
  const out={v:2,cur:null,matches:{},deleted:[]};
  let raw=null;
  try{ raw=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ raw=null; }
  if(raw&&raw.matches&&typeof raw.matches==='object'){
    Object.values(raw.matches).forEach(x=>{ const m=cleanMatch(x); if(m) out.matches[m.id]=m; });
    out.cur=raw.cur;
    if(Array.isArray(raw.deleted)) out.deleted=raw.deleted.map(x=>String(x).replace(/[^0-9a-z]/gi,'')).filter(Boolean).slice(-200);
    out.deleted.forEach(id=>{ delete out.matches[id]; });
  }else{
    try{
      const old=JSON.parse(localStorage.getItem(OLDKEY)||'null');
      if(old&&Array.isArray(old.ev)&&(old.ev.length||(old.roster||[]).length)){
        const m=cleanMatch({id:'m'+newId(),opp:old.opp,roster:old.roster,ev:old.ev,set:old.set});
        if(m){ out.matches[m.id]=m; out.cur=m.id; }
      }
    }catch(e){}
  }
  if(!out.cur||!out.matches[out.cur]){
    const list=Object.values(out.matches).sort((a,b)=>b.created-a.created);
    if(list.length) out.cur=list[0].id;
    else{ const m=newMatch(''); out.matches[m.id]=m; out.cur=m.id; }
  }
  return out;
}

const cloud={state:'off',base:null,col:null,pushed:{},drop:new Set(),metaSig:'',busy:false,again:false,fail:0,lastPull:0,quotaWarned:false};
let syncT=0;
function scheduleSync(){ if(cloud.state!=='on') return; clearTimeout(syncT); syncT=setTimeout(syncNow,500); }
function toCloud(m){ const o=packMatch(m); o.v=2; o.a=m.alias.join(','); o.c=m.created; o.g=m.gone.join(','); return o; }
function applyCloud(docs,meta){
  let changed=false;
  const delCloud=meta&&Array.isArray(meta.deleted)?meta.deleted.map(String):[];
  cloud.metaSig=meta?JSON.stringify({deleted:delCloud.slice(-200)}):'';
  delCloud.forEach(id=>{ if(!db.deleted.includes(id)){ markDeleted(id); changed=true; } });
  db.deleted.forEach(id=>{ if(db.matches[id]){ delete db.matches[id]; changed=true; } });
  const pristineCur=db.matches[db.cur]&&isPristine(db.matches[db.cur])?db.cur:null;
  docs.forEach(d=>{
    const inc=unpackMatch(d.data()); if(!inc) return;
    cloud.pushed[d.id]=JSON.stringify(d.data());
    if(db.deleted.includes(inc.id)) return;
    const local=findLocal(inc.id);
    if(local){
      const before=JSON.stringify(toCloud(local));
      mergeInto(local,inc);
      if(JSON.stringify(toCloud(local))!==before) changed=true;
      if(local.id!==inc.id) cloud.drop.add(inc.id);
    }else{ db.matches[inc.id]=inc; changed=true; }
  });
  if(!db.matches[db.cur]||(pristineCur&&Object.keys(db.matches).length>1)){
    if(pristineCur&&db.matches[pristineCur]&&isPristine(db.matches[pristineCur])) delete db.matches[pristineCur];
    const list=Object.values(db.matches).sort((a,b)=>b.created-a.created);
    if(list.length) db.cur=list[0].id; else{ const n=newMatch(''); db.matches[n.id]=n; db.cur=n.id; }
    changed=true;
  }
  return changed;
}
async function pull(first){
  if(!cloud.col) return;
  cloud.lastPull=Date.now();
  const [meta,qs]=await Promise.all([cloud.base.get(),cloud.col.get()]);
  const before=Object.values(db.matches).reduce((a,m)=>a+m.ev.length,0);
  const changed=applyCloud(qs.docs,meta.exists?meta.data():null);
  if(changed){
    try{ localStorage.setItem(KEY,JSON.stringify(db)); }catch(e){}
    resetSel(); flash=null; renderAll();
    const after=Object.values(db.matches).reduce((a,m)=>a+m.ev.length,0);
    if(first&&after>before) toast(`Dati recuperati dal tuo account: ${att(after)}.`);
  }
}
async function initCloud(){
  try{
    const c=window.claude; if(!c||typeof c.use!=='function') return;
    const [dbx,ux]=await Promise.all([c.use('db'),c.use('user')]);
    if(!dbx||!ux) return;
    const uid=await ux.id(); if(!uid) return;
    cloud.base=dbx.doc('data/users/'+uid+'/scout');
    cloud.col=cloud.base.collection('matches');
    cloud.state='loading'; renderCloudBits();
    await pull(true);
    cloud.state='on'; renderCloudBits();
    scheduleSync();
  }catch(e){
    const code=e&&e.code;
    cloud.state=(code==='unavailable'||code==='resource_exhausted')?'error':'off';
    renderCloudBits();
    if(cloud.state==='error') setTimeout(initCloud,8000);
  }
}
async function syncNow(){
  if(cloud.state!=='on') return;
  if(cloud.busy){ cloud.again=true; return; }
  cloud.busy=true;
  try{
    for(const m of Object.values(db.matches)){
      if(isPristine(m)) continue;
      const body=toCloud(m), sig=JSON.stringify(body);
      if(cloud.pushed[m.id]===sig) continue;
      await cloud.col.doc(m.id).set(body);
      cloud.pushed[m.id]=sig;
    }
    for(const id of db.deleted.concat([...cloud.drop])){
      if(cloud.pushed[id]===undefined&&!cloud.drop.has(id)) continue;
      await cloud.col.doc(id).delete();
      delete cloud.pushed[id]; cloud.drop.delete(id);
    }
    const meta={deleted:db.deleted.slice(-200)}, ms=JSON.stringify(meta);
    if(ms!==cloud.metaSig&&(db.deleted.length||cloud.metaSig)){ await cloud.base.set(meta); cloud.metaSig=ms; }
    if(cloud.fail){ cloud.fail=0; renderCloudBits(); }
  }catch(e){
    const code=e&&e.code;
    if(['revoked','not_granted','capability_disabled','capability_removed'].includes(code)){ cloud.state='off'; }
    else if(code==='quota_exceeded'){ if(!cloud.quotaWarned){ cloud.quotaWarned=true; toast('Spazio online pieno: elimina qualche partita vecchia. I dati restano su questo telefono.'); } }
    else{ cloud.fail++; setTimeout(scheduleSync,Math.min(30000,2000*cloud.fail)); }
    renderCloudBits();
  }finally{
    cloud.busy=false;
    if(cloud.again){ cloud.again=false; scheduleSync(); }
  }
}

/* ---------- statistiche ---------- */
function aggregate(evs){
  const P={}, T={};
  const mk=x=>Object.assign({t:0,K:0,D:0,B:0,E:0},x);
  const bump=(o,e)=>{ o.t++; o[e.o]++; };
  evs.forEach(e=>{
    const p=P[e.n]||(P[e.n]=mk({n:e.n,sh:{}}));
    bump(p,e);
    const k=e.z+e.d;
    bump(p.sh[k]||(p.sh[k]=mk({z:e.z,d:e.d})),e);
    bump(T[k]||(T[k]=mk({z:e.z,d:e.d})),e);
  });
  const players=Object.values(P).map(p=>Object.assign(p,{kp:p.K/p.t,eff:(p.K-p.E-p.B)/p.t,dp:p.D/p.t}));
  return {players,team:T};
}
const byUse=(a,b)=>b.t-a.t||b.K-a.K;
const byKill=(a,b)=>b.K-a.K||(b.K/b.t)-(a.K/a.t)||b.t-a.t;
const topShot=p=>Object.values(p.sh).sort(byUse)[0]||null;
const topKill=p=>Object.values(p.sh).filter(s=>s.K>0).sort(byKill)[0]||null;

function defense(z,d){
  if(isC(d)) return z==='3'?'zona '+d+' pronta sul primo tempo':'zona '+d+' pronta sull’attacco da dietro';
  if(d==='T') return 'una giocatrice corta dietro il muro';
  if(z==='4') return d==='D'?'zona 5 pronta sulla diagonale':'zona 1 pronta sulla parallela';
  if(z==='2') return d==='D'?'zona 1 pronta sulla diagonale':'zona 5 pronta sulla parallela';
  return d==='L'?'zona 6 pronta in fondo al centro':'zone 1 e 5 pronte sulle diagonali';
}
function blockTip(z,d){ if(isC(d)) return z==='3'?'il nostro centrale chiuda verso zona '+d:z==='P'?'il centrale segua la pipe e chiuda verso zona '+d:'chiudete verso zona '+d; if(d==='T'||z==='3'||z==='P') return ''; return d==='D'?'toglietele la diagonale':'chiudete la parallela'; }

function insights(evs){
  const A=aggregate(evs);
  const named=A.players.filter(p=>p.n!=='?');
  const threats=named.filter(p=>p.t>=3&&p.K>=1).sort((a,b)=>b.K-a.K||b.kp-a.kp||b.t-a.t).slice(0,3);
  const tset=new Set(threats.map(p=>p.n));
  const notes=[];
  named.filter(p=>p.t>=4&&!tset.has(p.n)).forEach(p=>{
    const s=topShot(p), tips=tipCount(p);
    const weak=p.eff<=0, pred=!!(s&&s.t/p.t>=.45), tipHeavy=tips>=2&&tips/p.t>=.25;
    if(!weak&&!pred&&!tipHeavy) return;
    const parts=[];
    if(weak) parts.push(`Efficienza ${spct(p.eff)}: ${pts(p.K)} e ${p.E+p.B} tra errori e murate su ${att(p.t)}.`);
    if(pred) parts.push(`${s.t} attacchi su ${p.t} sono ${shotName(s.z,s.d)}. Difesa: ${defense(s.z,s.d)}.`);
    if(tipHeavy&&!(pred&&s.d==='T')) parts.push(`${tips} pallonetti su ${p.t}: serve una giocatrice corta dietro il muro.`);
    if(weak) parts.push('Si può tenerla con il muro a uno e aiutare sulle altre.');
    const kind=weak?'weak':tipHeavy?'tip':'pred';
    notes.push({kind,n:p.n,head:weak?'Rende poco':tipHeavy?'Usa molto il pallonetto':'Prevedibile',text:parts.join(' ')});
  });
  const ord={pred:0,tip:1,weak:2};
  notes.sort((a,b)=>ord[a.kind]-ord[b.kind]);
  const costly=Object.values(A.team).filter(s=>s.K>0).sort(byKill).slice(0,3);
  return {A,threats,notes,costly};
}
const NB='\u00a0';
function tipCount(p){ return Object.values(p.sh).filter(s=>s.d==='T').reduce((a,s)=>a+s.t,0); }
function threatFacts(p){
  const f=[], k=topKill(p), u=topShot(p), tips=tipCount(p);
  if(k){
    f.push(['Dove fa punto',`${shotName(k.z,k.d)} (${k.K}${NB}su${NB}${k.t})`]);
    f.push(['Difesa',defense(k.z,k.d)]);
    const b=blockTip(k.z,k.d); if(b) f.push(['Muro',b]);
  }
  if(u&&k&&(u.z!==k.z||u.d!==k.d)) f.push(['Colpo più usato',`${shotName(u.z,u.d)} (${u.t}${NB}${plural(u.t,'volta','volte')})`]);
  if(tips>=2&&tips/p.t>=.25&&!(k&&k.d==='T')) f.push(['Pallonetto',`${tips} su ${p.t}: serve una giocatrice corta dietro il muro`]);
  if(p.kp<.35) f.push(['Nota',`fa punti per quantità, va a segno il ${pct(p.kp)} delle volte`]);
  return f;
}

/* ---------- filtro periodo ---------- */
let filter='match';
function sameOpp(m){ const k=norm(m.opp); if(!k) return []; return Object.values(db.matches).filter(x=>x.id!==m.id&&norm(x.opp)===k); }
function filterOpts(){
  const m=cur(); const o=[{k:'match',l:'Tutta la partita'}];
  const sets=[...new Set(m.ev.map(e=>e.s))].sort((a,b)=>a-b);
  if(sets.length>1) sets.forEach(s=>o.push({k:'set'+s,l:'Set '+s}));
  const others=sameOpp(m);
  if(others.length) o.push({k:'opp',l:`Tutte contro ${m.opp.trim()} (${others.length+1})`});
  return o;
}
function fEvents(scope){
  const f=scope||filter, m=cur();
  if(f==='opp') return [m].concat(sameOpp(m)).flatMap(x=>x.ev);
  if(f.indexOf('set')===0){ const s=+f.slice(3); return m.ev.filter(e=>e.s===s); }
  return m.ev;

const GO={'4':[37,110],'3':[80,110],'2':[123,110],'P':[80,141],'1':[123,141]};
const GT={'4L':[[27,27]],'4D':[[131,34]],'2L':[[133,27]],'2D':[[29,34]],'3L':[[76,25]],'31':[[35,38]],'35':[[125,38]],'P1':[[36,33]],'P6':[[80,27]],'P5':[[124,33]],'11':[[34,30]],'16':[[84,27]],'15':[[123,25]],'3D':[[33,40],[127,40]],'PL':[[85,31]],'PD':[[40,47],[120,47]],'4T':[[55,84]],'3T':[[80,81]],'2T':[[105,84]],'PT':[[80,74]]};
const f1=v=>Math.round(v*10)/10;
function dcol(s){ const r=s.K/s.t; return r>=.5?'var(--kill)':r>=.25?'var(--warn)':'var(--calm)'; }
function arrow(x1,y1,x2,y2,w,col){
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L;
  const hl=4.5+w*1.15, hw=2.6+w*.95, bx=x2-ux*hl, by=y2-uy*hl, px=-uy, py=ux;
  return `<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(bx)}" y2="${f1(by)}" style="stroke:${col};stroke-width:${f1(w)};stroke-linecap:round"/><polygon points="${f1(x2)},${f1(y2)} ${f1(bx+px*hw)},${f1(by+py*hw)} ${f1(bx-px*hw)},${f1(by-py*hw)}" style="fill:${col}"/>`;
}
function diagram(shots,label){
  const list=Object.values(shots||{}).filter(s=>s.t>0).sort((a,b)=>a.t-b.t);
  const max=list.reduce((a,s)=>Math.max(a,s.t),1);
  const used=new Set(list.map(s=>s.z));
  let g='';
  list.forEach(s=>{
    const r=s.t/max, col=dcol(s), o=GO[s.z], tg=GT[s.z+s.d];
    if(s.d==='T'){
      const t=tg[0], cx=(o[0]+t[0])/2, cy=Math.min(o[1],t[1])-20;
      g+=`<path d="M${o[0]} ${o[1]}Q${f1(cx)} ${f1(cy)} ${t[0]} ${t[1]}" style="stroke:${col};stroke-width:${f1(1.2+1.6*r)};fill:none;stroke-dasharray:2.4 2.4;stroke-linecap:round"/><circle cx="${t[0]}" cy="${t[1]}" r="${f1(2.8+3.8*r)}" style="fill:${col};stroke:var(--d-fill);stroke-width:1.4"/>`;
    }else{
      const w=(1.5+4.5*r)*(tg.length>1?.8:1);
      tg.forEach(t=>{ g+=arrow(o[0],o[1],t[0],t[1],w,col); });
    }
  });
  const org=(z,t)=>{ const p=GO[z], on=used.has(z)?' on':''; return z==='P'
    ?`<g class="org${on}"><rect x="${p[0]-13}" y="${p[1]-6.5}" width="26" height="13" rx="6.5"/><text x="${p[0]}" y="${p[1]+2.9}">pipe</text></g>`
    :`<g class="org${on}"><circle cx="${p[0]}" cy="${p[1]}" r="7"/><text x="${p[0]}" y="${p[1]+2.9}">${t}</text></g>`; };
  return `<svg class="dg-svg" viewBox="0 0 160 166" role="img" aria-label="${esc(label||'Campo')}"><text class="dz" x="37" y="10">zona 1</text><text class="dz" x="80" y="10">zona 6</text><text class="dz" x="123" y="10">zona 5</text><text class="side" transform="translate(8.5 56) rotate(-90)">noi</text><text class="side" transform="translate(8.5 128) rotate(-90)">loro</text><rect class="dour" x="16" y="15" width="128" height="81"/><line class="dln" x1="16" y1="69" x2="144" y2="69"/><rect class="dthr" x="16" y="96" width="128" height="64"/><line class="dln" x1="16" y1="123" x2="144" y2="123"/><line class="dnet" x1="10" y1="96" x2="150" y2="96"/>${g}${org('4','4')}${org('3','3')}${org('2','2')}${org('P')}${org('1','1')}</svg>`;
}
function obar(o,mini){
  const label=OS.filter(k=>o[k]).map(k=>OC[k]+' '+o[k]).join(', ');
  return `<div class="obar${mini?' mini':''}" role="img" aria-label="${esc(label)}">${OS.map(k=>o[k]?`<span style="flex:${o[k]};background:${OV[k]}"></span>`:'').join('')}</div>`;

function flyBall(btn,e){
  if(reduced||!btn||!btn.animate) return;
  try{
    const r=btn.getBoundingClientRect(), c=$('#court').getBoundingClientRect(); if(!r.width) return;
    const x0=r.left+r.width/2, y0=r.top+r.height/2;
    const dir=isC(e.d)?(e.d==='1'?-1:e.d==='5'?1:(e.z==='1'?-.4:0)):e.d==='D'?(e.z==='4'?1:e.z==='2'?-1:0):e.d==='L'?0:0;
    const x1=Math.min(c.right-16,Math.max(c.left+16,x0+dir*Math.min(120,c.width*.3))), y1=c.top-26;
    const tip=e.d==='T', mx=(x0+x1)/2, my=Math.min(y0,y1)-(tip?46:14);
    const el=document.createElement('div'); el.className='fly'; el.innerHTML=BALL; el.style.setProperty('--c',OV[e.o]);
    document.body.appendChild(el);

    el.animate([{transform:T(x0,y0,.6,0),opacity:.2},{transform:T(mx,my,1.05,200),opacity:1,offset:.55},{transform:T(x1,y1,.75,380),opacity:0}],{duration:tip?640:460,easing:'cubic-bezier(.25,.7,.35,1)'}).onfinish=()=>el.remove();
    setTimeout(()=>{ if(el.isConnected) el.remove(); },1200);
  }catch(err){}
}

function briefPending(m){

function restoreEvent(mid,e){ const m=db.matches[mid]; if(!m||m.ev.some(x=>x.id===e.id)) return false; const q=qids(m.ev.concat([e])).get(e); m.gone=m.gone.filter(g=>g!==e.id&&g!==q); m.ev.push(e); m.ev.sort((a,b)=>a.t-b.t); save(); return true; }

/* ---------- riassunto del set: cosa dire alle giocatrici ---------- */
function setsWithData(m,min){ return [...new Set(m.ev.map(e=>e.s))].sort((a,b)=>a-b).filter(s=>m.ev.filter(e=>e.s===s).length>=(min||4)); }
function setBrief(s){
  const m=cur(), evs=m.ev.filter(e=>e.s===s);
  const ps=[...new Set(m.ev.map(e=>e.s))].filter(x=>x<s&&m.ev.filter(e=>e.s===x).length>=4).sort((a,b)=>b-a)[0];
  const A=aggregate(evs), P=ps?aggregate(m.ev.filter(e=>e.s===ps)):null, T=evs.length;
  const tot=evs.reduce((a,e)=>(a[e.o]++,a),{K:0,D:0,B:0,E:0});
  const L=[], used=new Set(), chg={};
  if(P) A.players.filter(p=>p.n!=='?'&&p.t>=3).forEach(p=>{ const q=P.players.find(x=>x.n===p.n); if(!q||q.t<3) return; const a=topShot(p), b=topShot(q);
    if(a&&b&&(a.z+a.d)!==(b.z+b.d)&&a.t/p.t>=.4&&b.t/q.t>=.4) chg[p.n]={a,b}; });
  A.players.filter(p=>p.n!=='?'&&p.K>=2).sort((a,b)=>b.K-a.K||b.kp-a.kp).slice(0,2).forEach(p=>{
    used.add(p.n); const k=topKill(p), b=k&&blockTip(k.z,k.d), c=chg[p.n];
    L.push({ic:'K',who:'#'+p.n,head:`${pts(p.K)} su ${p.t}${k?', '+shotName(k.z,k.d):''}`,text:(k?cap(defense(k.z,k.d))+'.':'Tenetela d’occhio.')+(b?' Muro: '+b+'.':'')+(c?` Ha cambiato: nel set ${ps} andava ${c.b.d==='T'?'di pallonetto':shotName(c.b.z,c.b.d)}.`:'')});
  });
  A.players.filter(p=>p.n!=='?'&&!used.has(p.n)&&p.t>=3).forEach(p=>{ const u=topShot(p); if(!u||u.t/p.t<.6) return; used.add(p.n);
    L.push({ic:'D',who:'#'+p.n,head:`Va quasi sempre ${shotName(u.z,u.d)} (${u.t} su ${p.t})`,text:cap(defense(u.z,u.d))+'.'}); });
  const tips=evs.filter(e=>e.d==='T'), tk=tips.filter(e=>e.o==='K').length;
  if(tips.length>=2&&tk>=1) L.push({ic:'T',who:'Pallonetti',head:`${tips.length} nel set, ${pts(tk)}`,text:'Chi non salta a muro resti corta, pronta a entrare.'});
  Object.keys(chg).filter(n=>!used.has(n)).forEach(n=>{ const {a,b}=chg[n]; used.add(n);
    L.push({ic:'C',who:'#'+n,head:'Ha cambiato colpo',text:`Nel set ${ps} ${shotName(b.z,b.d)}, ora ${shotName(a.z,a.d)}: ${defense(a.z,a.d)}.`}); });
  const calm=A.players.filter(p=>p.n!=='?'&&!used.has(p.n)&&p.t>=3&&p.eff<=0).map(p=>'#'+p.n);
  if(calm.length) L.push({ic:'OK',who:joinIt(calm),head:calm.length>1?'Le teniamo':'La teniamo',text:'Muro a uno e aiuti sulle altre.'});
  if(T>=6&&(tot.D+tot.B)/T>=.4) L.push({ic:'OK',who:'Squadra',head:`${tot.D} ${plural(tot.D,'difesa','difese')} e ${tot.B} ${plural(tot.B,'murata','murate')} su ${T}`,text:'La difesa tiene: continuate così.'});
  let head=`Loro in attacco: ${pts(tot.K)} su ${att(T)} (${pct(tot.K/T)}).`;
  if(P){ const pk=P.players.reduce((a,p)=>a+p.K,0), pt=P.players.reduce((a,p)=>a+p.t,0); if(pt){ const d=tot.K/T-pk/pt; head+=Math.abs(d)<.05?` Come nel set ${ps}.`:` Nel set ${ps} erano al ${pct(pk/pt)}: ${d>0?'stanno crescendo':'li stiamo frenando'}.`; } }
  return {s,T,head,lines:L.slice(0,6)};
}
const BIC={K:IC.alert,D:IC.shield,T:IC.tip,C:IC.swap,OK:IC.check};
function briefText(B){
  const m=cur(), L=[`*Set ${B.s}${m.opp.trim()?' vs '+m.opp.trim():''}: come muoverci*`,B.head,''];
  B.lines.forEach(x=>L.push(`- ${x.who}: ${x.head.charAt(0).toLowerCase()+x.head.slice(1)}. ${x.text}`));

function openSetBrief(s){

  if(B.T<4){ openSheet(`<div class="sh-head"><h2 id="sheetTitle">Set ${s}</h2>${closeBtn()}</div><p class="sub">Servono almeno 4 attacchi segnati nel set: ora ne hai ${B.T}.</p>`); return; }

function briefTiles(){
  const m=cur(), sets=setsWithData(m), tiles=sets.map(s=>{ const ev=m.ev.filter(e=>e.s===s), k=ev.filter(e=>e.o==='K').length;
    return `<button class="btile" data-brief="${s}"><span class="bt-n">${s}</span><span class="bt-t"><b>Set ${s}</b><small>${k} su ${ev.length}</small></span></button>`; });
  if(m.ev.length>=8) tiles.push(`<button class="btile tb" data-brief="tb" id="tbOpen"><span class="bt-n">5</span><span class="bt-t"><b>Tie-break</b><small>priorità</small></span></button>`);

  return `<h2 class="sech">Da dire alle giocatrici</h2><div class="btiles">${tiles.join('')}</div>`;
}

/* ---------- riassunto per il tie-break ---------- */
function tiebreak(evs){
  const A=aggregate(evs), T=evs.length;
  const tot=evs.reduce((a,e)=>(a[e.o]++,a),{K:0,D:0,B:0,E:0});
  const sets=[...new Set(evs.map(e=>e.s))].sort((a,b)=>a-b);
  const rs=sets.length>=3?sets.slice(-2):[];
  const R=rs.length?aggregate(evs.filter(e=>rs.includes(e.s))):null, O=rs.length?aggregate(evs.filter(e=>!rs.includes(e.s))):null;
  const find=(g,n)=>g&&g.players.find(p=>p.n===n);
  const trend=n=>{ const r=find(R,n), o=find(O,n); return (r&&o&&r.t>=3&&o.t>=3)?r.kp-o.kp:0; };
  const watch=[], good=[], covered=new Set(), goodN=new Set();
  A.players.filter(p=>p.n!=='?'&&p.t>=3&&p.K>=2).forEach(p=>{
    const k=topKill(p), tr=trend(p.n), tips=tipCount(p), t=[];
    if(k){ covered.add(k.z+k.d); t.push(`Fa punto soprattutto ${shotName(k.z,k.d)} (${k.K}${NB}su${NB}${k.t}).`,`Difesa: ${defense(k.z,k.d)}.`); const b=blockTip(k.z,k.d); if(b) t.push(`Muro: ${b}.`); }
    if(tips>=2&&tips/p.t>=.25&&!(k&&k.d==='T')) t.push(`Occhio al pallonetto: ${tips} su ${p.t}.`);
    if(tr>=.2) t.push('Negli ultimi due set segna più di prima.');
    watch.push({score:p.K*(.6+p.kp)+(tr>=.2?2:0),tag:'#'+p.n,head:`${pts(p.K)} su ${att(p.t)} (${pct(p.kp)})`,text:t.join(' ')});
  });
  Object.values(A.team).filter(s=>s.K>=2&&s.K/s.t>=.4&&!covered.has(s.z+s.d)).forEach(s=>{
    const who_=A.players.filter(p=>p.sh[s.z+s.d]&&p.sh[s.z+s.d].K).map(p=>who(p.n));
    watch.push({score:s.K*(.4+s.K/s.t),tag:'Colpo',head:`${cap(shotName(s.z,s.d))}: ${pts(s.K)} su ${s.t}`,text:`Punti di ${joinIt(who_)}. Difesa: ${defense(s.z,s.d)}.`});
  });
  const tipT=Object.values(A.team).filter(s=>s.d==='T'), tK=tipT.reduce((a,s)=>a+s.K,0), tT=tipT.reduce((a,s)=>a+s.t,0);
  if(tK>=2&&tK/tT>=.35) watch.push({score:tK*.9,tag:'Pallonetto',head:`${pts(tK)} su ${tT} pallonetti`,text:'Sempre una giocatrice corta dietro il muro: non restate piantate in fondo.'});
  A.players.filter(p=>p.n!=='?'&&p.t>=4&&p.eff<=0).forEach(p=>{ goodN.add(p.n);
    good.push({score:p.t*(.5-p.eff),tag:'#'+p.n,head:`La teniamo: ${pts(p.K)} su ${att(p.t)}`,text:`Efficienza ${spct(p.eff)}. Muro a uno su di lei e aiuti sulle altre.`}); });
  A.players.filter(p=>p.n!=='?'&&!goodN.has(p.n)&&trend(p.n)<=-.2).forEach(p=>{ const r=find(R,p.n);
    good.push({score:3,tag:'#'+p.n,head:'In calo',text:`Negli ultimi due set: ${r.K} su ${r.t}, meno di prima.`}); });
  A.players.filter(p=>p.n!=='?'&&p.t>=4&&!goodN.has(p.n)).forEach(p=>{ const s=topShot(p); if(!s||s.t<3||s.t/p.t<.5) return;
    good.push({score:2+s.t/p.t,tag:'#'+p.n,head:'Prevedibile',text:`${s.t} attacchi su ${p.t} ${shotName(s.z,s.d)}. Difesa: ${defense(s.z,s.d)}.`}); });
  if(T>=10&&tot.D/T>=.3) good.push({score:tot.D/T*8,tag:'Difesa',head:`Rigiochiamo il ${pct(tot.D/T)} dei loro attacchi`,text:`${tot.D} difese su ${att(T)}: la difesa tiene, continuate così.`});
  if(tot.B>=2){ const bl=A.players.filter(p=>p.B).sort((a,b)=>b.B-a.B).slice(0,2).map(p=>who(p.n));
    good.push({score:tot.B*1.2,tag:'Muro',head:`${tot.B} murate`,text:`Il muro c’è, soprattutto su ${joinIt(bl)}.`}); }
  if(tot.E>=3&&tot.E/T>=.12) good.push({score:tot.E,tag:'Errori',head:`Sbagliano ${tot.E} attacchi (${pct(tot.E/T)})`,text:'Palla in gioco e pazienza: i punti ce li regalano.'});
  Object.values(A.team).filter(s=>s.t>=4&&s.K===0).sort(byUse).slice(0,2).forEach(s=>{
    good.push({score:s.t*.5,tag:'Colpo',head:`${cap(shotName(s.z,s.d))}: 0 punti su ${s.t}`,text:'Lì li leggiamo bene.'}); });
  watch.sort((a,b)=>b.score-a.score); good.sort((a,b)=>b.score-a.score);
  let trendLine='';
  if(R&&O){ const rk=R.players.reduce((a,p)=>a+p.K,0), rt=R.players.reduce((a,p)=>a+p.t,0), ok=O.players.reduce((a,p)=>a+p.K,0), ot=O.players.reduce((a,p)=>a+p.t,0);
    if(rt>=6&&ot>=6){ const d=rk/rt-ok/ot; trendLine=d>=.1?` Negli ultimi due set salgono al ${pct(rk/rt)}.`:d<=-.1?` Negli ultimi due set scendono al ${pct(rk/rt)}.`:''; } }
  return {T,tot,watch:watch.slice(0,5),good:good.slice(0,4),head:`Attaccano con il ${pct(tot.K/T)} a segno: ${pts(tot.K)} su ${att(T)}.`+trendLine};
}
function tieText(){
  const m=cur(), I=tiebreak(m.ev), L=[];
  L.push(`*Tie-break${m.opp.trim()?' vs '+m.opp.trim():''}: cosa conta*`, I.head);
  if(I.watch.length){ L.push('','*Da guardare, in ordine*'); I.watch.forEach((w,i)=>L.push(`${i+1}. ${w.tag==='Colpo'||w.tag==='Pallonetto'?'':w.tag+', '}${w.head}. ${w.text}`)); }
  if(I.good.length){ L.push('','*Cosa va bene*'); I.good.forEach(g=>L.push(`- ${g.tag.startsWith('#')?g.tag+', '+g.head.charAt(0).toLowerCase()+g.head.slice(1):g.head}. ${g.text}`)); }
  return L.join('\n');
}
function openTiebreak(){
  const m=cur();
  if(m.ev.length<8){ openSheet(`<div class="sh-head"><h2 id="sheetTitle">Riassunto per il tie-break</h2>${closeBtn()}</div><p class="sub">Servono almeno 8 attacchi segnati in questa partita: ora ne hai ${m.ev.length}.</p>`); return; }
  const I=tiebreak(m.ev);
  const item=(x,i)=>`<li><span class="pr">${i+1}</span><p><b>${x.tag.startsWith('#')?`<span class="tg">${esc(x.tag)}</span>`:''}${esc(x.head)}</b>${esc(x.text)}</p></li>`;
  const itemG=x=>`<li><span class="pr">${IC.check}</span><p><b>${x.tag.startsWith('#')?`<span class="tg">${esc(x.tag)}</span>`:''}${esc(x.head)}</b>${esc(x.text)}</p></li>`;
  openSheet(`<div class="sh-head"><h2 id="sheetTitle">Tie-break: cosa conta</h2>${closeBtn()}</div><p class="tb-head">${esc(I.head)}</p>`
    +`<h3 class="tb-sec">Da guardare, in ordine</h3>`+(I.watch.length?`<ol class="tb-list">${I.watch.map(item).join('')}</ol>`:'<p class="sub">Nessuna minaccia chiara: nessun colpo o giocatrice fa punti con regolarità.</p>')
    +`<h3 class="tb-sec">Cosa va bene</h3>`+(I.good.length?`<ul class="tb-list good">${I.good.map(itemG).join('')}</ul>`:'<p class="sub">Ancora niente di netto a nostro favore.</p>')
    +`<p class="tiny">Tutta la partita. Se ci sono almeno 3 set, gli ultimi due vengono confrontati con i precedenti.</p><button class="btn primary block" id="tbSend" style="margin-top:14px">${IC.share}<span>Manda alla squadra</span></button>`);
  $('#tbSend').onclick=()=>textSheet('Tie-break per la squadra',tieText(),'Pronto per WhatsApp.');
}

function renderStrategy(){
  const box=$('#v-strategy'), I=insights(fEvents());
  const chips=chipsHTML();
  if(!I.A.players.some(p=>p.n!=='?'&&p.t>=3)){ box.innerHTML=chips+emptyState('Servono più dati','I consigli arrivano quando una giocatrice ha almeno 3 attacchi registrati.'); bindEmpty(box); return; }
  const ranks=['La più pericolosa','Seconda minaccia','Terza minaccia'];
  let h=chips+briefTiles()+'<h2 class="sech">Le più pericolose</h2>';
  if(I.threats.length){
    h+=I.threats.map((p,i)=>`<article class="threat"><div class="th-head">${bigJersey(p.n)}<div><p class="th-rank">${ranks[i]}</p><p class="th-big">${pts(p.K)} su ${att(p.t)}</p><p class="th-sub">${pct(p.kp)} a segno, efficienza ${spct(p.eff)}</p></div></div><div class="th-body"><div class="dg">${diagram(p.sh,'Colpi di #'+p.n)}</div><dl class="facts">${threatFacts(p).map(f=>`<div><dt>${f[0]}</dt><dd>${esc(cap(f[1]))}</dd></div>`).join('')}</dl></div></article>`).join('');
  }else h+='<p class="sub">Nessuna avversaria con almeno 3 attacchi ha ancora fatto punto.</p>';
  if(I.notes.length) h+=`<h2 class="sech">Da tenere d'occhio</h2><ul class="notes">${I.notes.map(n=>`<li class="note ${n.kind}"><span class="tag">#${esc(n.n)}</span><p><b>${esc(n.head)}</b>${esc(n.text)}</p></li>`).join('')}</ul>`;
  if(I.costly.length) h+=`<h2 class="sech">Colpi che ci costano di più</h2><div class="team"><div class="dg">${diagram(I.A.team,'Tutti gli attacchi avversari')}</div><ul class="costly">${I.costly.map(s=>`<li><span class="k">${s.K}</span><span>${esc(cap(shotName(s.z,s.d)))}<small>${pts(s.K)} su ${s.t}. Difesa: ${esc(defense(s.z,s.d))}</small></span></li>`).join('')}</ul></div>`;
  const all=I.A.players.slice().sort((a,b)=>b.K-a.K||b.kp-a.kp||b.t-a.t);
  h+=`<h2 class="sech">Tutte le giocatrici</h2><div class="tablewrap"><table><thead><tr><th>N°</th><th>Attacchi</th><th>Punti</th><th>Eff.</th><th>Difese</th></tr></thead><tbody>${all.map(p=>`<tr><td><span class="jn">${p.n==='?'?'?':esc(p.n)}</span></td><td>${p.t}</td><td class="${p.t>=3&&p.kp>=.5?'hot':''}">${p.K}<small>${pct(p.kp)}</small></td><td>${spct(p.eff)}</td><td>${pct(p.dp)}</td></tr>`).join('')}</tbody></table></div><p class="tiny">Accanto ai punti, la percentuale a segno. Efficienza = (punti − errori − murate) ÷ attacchi. Difese = attacchi che abbiamo tenuto in gioco.</p>`;
  h+=`<button class="btn primary block" id="stShare" style="margin-top:18px">${IC.share}<span>Manda il report</span></button>`;
  box.innerHTML=h;
  $$('[data-brief]',box).forEach(b=>{ b.onclick=()=>{ const v=b.dataset.brief; if(v==='tb') openTiebreak(); else openSetBrief(+v); }; });
  $('#stShare').onclick=()=>textSheet('Report per la squadra',reportText(),'Pronto per WhatsApp: i titoli in grassetto appaiono già formattati.');
}

function reportText(scope){
  const m=cur(), evs=fEvents(scope), I=insights(evs), L=[];
  L.push(`*Scout attacco${m.opp.trim()?' vs '+m.opp.trim():''}*`);
  L.push(`${scopeLabel(scope)}, ${att(evs.length)}`);
  if(I.threats.length){
    L.push('','*Le più pericolose*');
    I.threats.forEach((p,i)=>{
      if(i) L.push('');
      L.push(`*#${p.n}*: ${pts(p.K)} su ${att(p.t)} (${pct(p.kp)})`);
      threatFacts(p).forEach(f=>L.push(f[0]+': '+f[1]));
    });
  }
  if(I.notes.length){ L.push('',"*Da tenere d'occhio*"); I.notes.forEach(n=>L.push(`- #${n.n}, ${n.head.toLowerCase()}: ${n.text}`)); }
  if(I.costly.length){ L.push('','*Colpi che ci costano di più*'); I.costly.forEach(s=>L.push(`- ${cap(shotName(s.z,s.d))}: ${pts(s.K)} su ${s.t}. Difesa: ${defense(s.z,s.d)}`)); }
  const all=I.A.players.slice().sort((a,b)=>b.K-a.K||b.t-a.t);
  if(all.length){
    L.push('','*Tutte*');
    all.forEach(p=>L.push(`${p.n==='?'?'N° non visto':'#'+p.n}: ${att(p.t)}, ${pts(p.K)}, eff. ${spct(p.eff)}`));
    L.push('','_Efficienza = (punti − errori − murate) / attacchi_');
  }
  return L.join('\n');
}

/* ---------- copia e condivisione (funzionano anche dentro l'app di Claude) ---------- */
let shareBlocked=false, readBlocked=false;
function copyText(text){
  let ok=false;
  const span=document.createElement('span');
  span.textContent=text;
  span.setAttribute('aria-hidden','true');
  span.style.cssText='position:fixed;top:0;left:0;clip:rect(0,0,0,0);white-space:pre;-webkit-user-select:text;user-select:text;';
  span.addEventListener('copy',ev=>{ ev.stopPropagation(); if(ev.clipboardData){ ev.preventDefault(); try{ ev.clipboardData.clearData(); ev.clipboardData.setData('text/plain',text); }catch(_){} } });
  document.body.appendChild(span);
  const s=window.getSelection();
  try{ const r=document.createRange(); r.selectNodeContents(span); s.removeAllRanges(); s.addRange(r); ok=document.execCommand('copy'); }catch(err){ ok=false; }
  try{ s.removeAllRanges(); }catch(err){}
  span.remove();
  if(ok) return Promise.resolve(true);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return Promise.race([navigator.clipboard.writeText(text).then(()=>true,()=>false),new Promise(r=>setTimeout(()=>r(false),1500))]);
  }
  return Promise.resolve(false);
}
function selectAll(el){ try{ const r=document.createRange(); r.selectNodeContents(el); const s=window.getSelection(); s.removeAllRanges(); s.addRange(r); }catch(e){} }
const closeBtn=()=>`<button class="iconbtn" data-close aria-label="Chiudi">${IC.x}</button>`;
function textSheet(title,text,note,isCode){
  const canShare=!!navigator.share&&!shareBlocked;
  openSheet(`<div class="sh-head"><h2 id="sheetTitle">${esc(title)}</h2>${closeBtn()}</div>${note?`<p class="sub">${esc(note)}</p>`:''}<div class="preview${isCode?' code':''}" id="pv" tabindex="0">${esc(text)}</div><div class="btnrow"><button class="btn primary" id="doCopy">${IC.copy}<span>Copia</span></button>${canShare?`<button class="btn ghost" id="doShare">${IC.share}<span>Condividi</span></button>`:''}</div><p class="tiny" id="copyHelp" hidden>Qui la copia automatica è bloccata: il testo è già selezionato, tienilo premuto e scegli Copia.</p>`);
  $('#doCopy').onclick=()=>{
    copyText(text).then(ok=>{
      const b=$('#doCopy'); if(!b) return;
      if(ok){ b.innerHTML=IC.check+'<span>Copiato</span>'; toast('Copiato: ora incollalo dove vuoi.'); }
      else{ selectAll($('#pv')); $('#copyHelp').hidden=false; }
    });
  };
  const sb=$('#doShare');
  if(sb) sb.onclick=()=>{
    let p; try{ p=navigator.share({text}); }catch(err){ p=Promise.reject(err); }

  };
  $('#pv').addEventListener('click',()=>selectAll($('#pv')));
}

/* ---------- codice per unire i telefoni ---------- */
function b64enc(str){ const bytes=new TextEncoder().encode(str); let bin=''; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000)); return btoa(bin); }
function b64dec(b64){ const bin=atob(b64); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
function packMatch(m){ const o={i:m.id,o:m.opp,d:m.date,s:m.set,r:m.roster.join(','),e:m.ev.map(e=>[e.id,e.n,e.z+e.d+e.o+e.s,e.t.toString(36)].join('.')).join(',')}; if(m.gone.length) o.g=m.gone.join(','); return o; }
function unpackMatch(p){
  if(!p||typeof p!=='object') return null;
  const ev=String(p.e||'').split(',').filter(Boolean).map(x=>{ const a=x.split('.'), c=a[2]||''; return {id:a[0],n:a[1],z:c[0],d:c[1],o:c[2],s:parseInt(c.slice(3),10),t:parseInt(a[3],36)}; });
  const list=v=>String(v||'').split(',').filter(Boolean);
  return cleanMatch({id:p.i,opp:p.o,date:p.d,set:p.s,roster:list(p.r),ev,alias:list(p.a),gone:list(p.g),created:p.c});
}
/* codice corto (PV3): circa 4 caratteri per attacco invece di 40. PV1 e PV2 si leggono ancora. */
const ZI=['4','3','2','P','1'], DI=['D','L','T','1','5','6'], OI=['K','D','B','E'];
const TU=4000;   // gli orari viaggiano arrotondati a 4 secondi
const zdo=e=>ZI.indexOf(e.z)*24+DI.indexOf(e.d)*4+OI.indexOf(e.o);
function qids(evs){ const cnt={}, out=new Map(); evs.slice().sort((a,b)=>a.t-b.t).forEach(e=>{ const b=qid(e), k=cnt[b]||0; cnt[b]=k+1; out.set(e,k?b+'r'+k:b); }); return out; }
function qid(e){ return 'q'+Math.round(e.t/TU).toString(36)+zdo(e).toString(36).padStart(2,'0')+e.s+(e.n==='?'?'x':e.n); }
function vput(a,v){ v=Math.max(0,Math.floor(v)||0); while(v>=128){ a.push((v%128)+128); v=Math.floor(v/128); } a.push(v); }
function sput(a,str){ const b=new TextEncoder().encode(String(str||'')); vput(a,b.length); b.forEach(x=>a.push(x)); }
const B64U=s=>s.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
function bytesToB64u(a){ let bin=''; for(let i=0;i<a.length;i+=0x8000) bin+=String.fromCharCode.apply(null,a.slice(i,i+0x8000)); return B64U(btoa(bin)); }
function b64uToBytes(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const bin=atob(s); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }
const DAY0=Date.UTC(2020,0,1);
function enc3(ms){
  const a=[3]; vput(a,ms.length);
  ms.forEach(m=>{
    sput(a,m.id); sput(a,m.opp);
    const p=m.date.split('-'); vput(a,Math.round((Date.UTC(+p[0],+p[1]-1,+p[2])-DAY0)/864e5));
    vput(a,m.set);
    const r=m.roster.map(n=>+n).filter(n=>n>=0&&n<=254); vput(a,r.length); r.forEach(n=>a.push(n));
    sput(a,m.alias.join(','));
    sput(a,m.gone.filter(g=>g.charAt(0)==='q').slice(-200).join(','));
    const ev=m.ev.filter(e=>ZI.includes(e.z)&&DI.includes(e.d)).slice().sort((x,y)=>x.t-y.t);
    const u0=ev.length?Math.round(ev[0].t/TU):Math.round(m.created/TU);
    vput(a,u0); vput(a,Math.max(0,u0-Math.round(m.created/TU)));
    vput(a,ev.length);
    let pu=u0;
    ev.forEach(e=>{ const u=Math.max(pu,Math.round(e.t/TU)); a.push(e.n==='?'?255:Math.min(254,+e.n)); a.push(zdo(e)); vput(a,(u-pu)*5+(e.s-1)); pu=u; });
  });
  return bytesToB64u(a);
}
function dec3(str){
  const a=b64uToBytes(str); let i=0;
  const byte=()=>{ if(i>=a.length) throw new Error('short'); return a[i++]; };
  const vget=()=>{ let v=0,mul=1,b; do{ b=byte(); v+=(b%128)*mul; mul*=128; }while(b>=128); return v; };
  const sget=()=>{ const n=vget(); if(i+n>a.length) throw new Error('short'); const s=new TextDecoder().decode(a.subarray(i,i+n)); i+=n; return s; };
  if(byte()!==3) throw new Error('ver');
  const out=[], nm=vget();
  for(let k=0;k<nm;k++){
    const id=sget(), opp=sget(), d=new Date(DAY0+vget()*864e5), set=vget();
    const rl=vget(), roster=[]; for(let j=0;j<rl;j++) roster.push(String(byte()));
    const alias=sget().split(',').filter(Boolean), gone=sget().split(',').filter(Boolean);
    const u0=vget(), back=vget(), n=vget(), ev=[];
    let u=u0;
    for(let j=0;j<n;j++){
      const nb=byte(), c=byte(), v=vget(); u+=Math.floor(v/5);
      const e={t:u*TU,n:nb===255?'?':String(nb),z:ZI[Math.floor(c/24)],d:DI[Math.floor(c%24/4)],o:OI[c%4],s:v%5+1};
      ev.push(e);
    }
    const qm=qids(ev); ev.forEach(e=>{ e.id=qm.get(e); });
    const date=d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
    const m=cleanMatch({id,opp,date,set,roster,ev,alias,gone,created:(u0-back)*TU});
    if(m) out.push(m);
  }
  return out;
}
const makeCode=ms=>'PV3:'+enc3(ms);
function parseCode(raw){
  const s=String(raw||'');
  const tryDecode=(body,fn)=>{ const full=body.replace(/\s+/g,''), first=body.trim().split(/\s+/)[0]; for(const c of [full,first]){ try{ return fn(JSON.parse(b64dec(c))); }catch(e){} } throw new Error('bad'); };
  const m3=s.match(/PV3:\s*([A-Za-z0-9_\-\s]+)/);
  if(m3){ const body=m3[1], full=body.replace(/\s+/g,''), first=body.trim().split(/\s+/)[0]; for(const c of [full,first]){ try{ return dec3(c); }catch(e){} } throw new Error('bad'); }
  let mm=s.match(/PV2:([A-Za-z0-9+/=\s]+)/);
  if(mm) return tryDecode(mm[1],o=>{ if(!o||!Array.isArray(o.m)) throw new Error('bad'); return o.m.map(unpackMatch).filter(Boolean); });
  mm=s.match(/PV1:([A-Za-z0-9+/=\s]+)/);
  if(mm) return tryDecode(mm[1],o=>{
    const ev=(Array.isArray(o.ev)?o.ev:[]).map(a=>Array.isArray(a)?{id:a[0],t:a[1],n:a[2],z:a[3],d:a[4],o:a[5],s:a[6]}:a);
    const first=ev[0]&&String(ev[0].id||'').replace(/[^0-9a-z]/gi,'');
    const m=cleanMatch({id:'mv1'+(first||newId()),opp:o.opp,roster:o.roster,ev});
    return m?[m]:[];
  });
  throw new Error('bad');
}
function codeMessage(ms,single){
  const code=makeCode(ms);
  if(single) return saveMessage(ms[0]);
  const n=ms.reduce((a,m)=>a+m.ev.length,0);
  return `Backup scout: ${ms.length} ${plural(ms.length,'partita','partite')}, ${att(n)}\n${code}`;
}
function mergeInto(t,inc){
  const gone=new Set(t.gone.concat(inc.gone||[]));
  t.gone=[...gone].slice(-1000);
  const q0=qids(t.ev);
  t.ev=t.ev.filter(e=>!gone.has(e.id)&&!gone.has(q0.get(e)));
  const have=new Set(); t.ev.forEach(e=>{ have.add(e.id); have.add(q0.get(e)); }); let added=0;
  const qi=qids(inc.ev);
  inc.ev.forEach(e=>{ const q=qi.get(e); if(!have.has(e.id)&&!have.has(q)&&!gone.has(e.id)&&!gone.has(q)){ t.ev.push(Object.assign({},e)); have.add(e.id); have.add(q); added++; } });
  t.ev.sort((a,b)=>a.t-b.t);
  t.roster=[...new Set(t.roster.concat(inc.roster))].sort(numSort);
  if(!t.opp.trim()&&inc.opp.trim()) t.opp=inc.opp;
  [inc.id].concat(inc.alias||[]).forEach(a=>{ if(a&&a!==t.id&&!t.alias.includes(a)) t.alias.push(a); });
  return added;
}
const findLocal=id=>db.matches[id]||Object.values(db.matches).find(m=>m.alias.includes(id))||null;
function afterImport(mid,msg){
  if(mid) db.cur=mid;
  filter='match'; resetSel(); flash=null;
  const box=$('#importBox'); if(box) box.value='';
  renderAll(); toast(msg);
}
function doImport(raw){
  if(!String(raw||'').trim()){ toast('Incolla prima il messaggio con il codice.'); return; }
  let list;
  try{ list=parseCode(raw); }catch(e){ toast("Codice non leggibile: copia tutto il messaggio, dall'inizio alla fine."); return; }
  if(!list.length){ toast('Nel codice non ci sono partite.'); return; }
  list.forEach(inc=>unmarkDeleted(inc.id));
  if(list.length>1){
    let created=0, added=0;
    list.forEach(inc=>{ const local=findLocal(inc.id); if(local) added+=mergeInto(local,inc); else{ db.matches[inc.id]=inc; created++; } });
    save(); afterImport(null,`Backup importato: ${created} ${plural(created,'partita nuova','partite nuove')}, ${added} ${plural(added,'attacco aggiunto','attacchi aggiunti')}.`);
    return;
  }
  const inc=list[0], local=findLocal(inc.id);
  if(local){ const n=mergeInto(local,inc); save(); afterImport(local.id,n?`Aggiunti ${att(n)} alla partita ${mDesc(local)}.`:`La partita ${mDesc(local)} è già aggiornata.`); return; }
  const m=cur();
  if(!m.ev.length&&!m.roster.length&&!m.opp.trim()){
    delete db.matches[m.id]; db.matches[inc.id]=inc; db.cur=inc.id; save();
    afterImport(inc.id,`Importata la partita ${mDesc(inc)}: ${att(inc.ev.length)}.`); return;
  }
  openSheet(`<div class="sh-head"><h2 id="sheetTitle">Dove li metto?</h2>${closeBtn()}</div><p class="sub">Il codice contiene la partita ${esc(mDesc(inc))}, ${att(inc.ev.length)}.</p><button class="btn primary block" id="imMerge">Unisci alla partita ${esc(mDesc(m))}</button><p class="tiny" style="margin:6px 2px 14px">Scegli questa se avete scoutato la stessa partita su due telefoni.</p><button class="btn ghost block" id="imNew">Tienila come partita separata</button>`);
  $('#imMerge').onclick=()=>{ const n=mergeInto(m,inc); save(); closeSheet(); afterImport(m.id,`Aggiunti ${att(n)} alla partita ${mDesc(m)}.`); };
  $('#imNew').onclick=()=>{ db.matches[inc.id]=inc; save(); closeSheet(); afterImport(inc.id,`Importata la partita ${mDesc(inc)}: ${att(inc.ev.length)}.`); };
}

let downloads=null;
try{ const c=window.claude; if(c&&typeof c.use==='function'){ c.use('downloads').then(d=>{ downloads=d||null; if(view==='share') renderShare(); },()=>{}); } }catch(e){}
function csvRows(ms){
  const rows=[['Partita','Data','Set','Numero','Zona','Colpo','Esito','Ora']];
  ms.forEach(m=>m.ev.forEach(e=>rows.push([m.opp.trim()||'Senza nome',fmtDateFull(m.date),e.s,e.n==='?'?'non visto':e.n,e.z==='P'?'Pipe':e.z,cap(DN[e.d]),OC[e.o],new Date(e.t).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})])));
  return rows;
}
const toCSV=rows=>'\uFEFF'+rows.map(r=>r.map(v=>{ const s=String(v); return /[;"\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(';')).join('\r\n');
const toTSV=rows=>rows.map(r=>r.map(v=>String(v).replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n');
function exportCsv(){
  const m=cur();
  if(!m.ev.length){ toast('Questa partita non ha ancora attacchi.'); return; }
  const rows=csvRows([m]);
  const sheet=()=>textSheet('Tabella per Excel',toTSV(rows),'Copiala e incollala in Excel o Google Fogli: ogni valore finisce nella sua cella.');
  if(!downloads){ sheet(); return; }
  downloads.save({filename:`scout-${slug(m.opp)||'partita'}-${m.date}.csv`,data:toCSV(rows)}).then(()=>toast('File CSV pronto.')).catch(err=>{
    const c=err&&err.code;
    if(c==='declined') return;
    if(c==='rate_limited'){ toast("C'è già un salvataggio in corso."); return; }
    downloads=null; if(view==='share') renderShare(); sheet();
  });
}

/* ---------- fogli dal basso ---------- */
let sheetOnClose=null, sheetTimer=0, lastFocus=null;
function openSheet(html,onClose){
  clearTimeout(sheetTimer);
  const prev=sheetOnClose; sheetOnClose=null; if(prev) prev();
  const scrim=$('#scrim'), sh=$('#sheet');
  sh.innerHTML='<div class="grab" aria-hidden="true"></div>'+html;
  sheetOnClose=onClose||null;
  if(scrim.hidden){ lastFocus=document.activeElement; scrim.hidden=false; void scrim.offsetWidth; }
  scrim.classList.add('open');
  sh.scrollTop=0;
  const af=sh.querySelector('[data-autofocus]');
  setTimeout(()=>{ try{ (af||sh).focus({preventScroll:true}); }catch(e){} },reduced?0:60);
}
function closeSheet(){
  const scrim=$('#scrim');
  if(scrim.hidden||!scrim.classList.contains('open')) return;
  scrim.classList.remove('open');
  const cb=sheetOnClose; sheetOnClose=null;
  clearTimeout(sheetTimer);
  sheetTimer=setTimeout(()=>{ scrim.hidden=true; $('#sheet').innerHTML=''; },reduced?0:230);
  if(cb) cb();
  if(lastFocus&&lastFocus.tagName==='BUTTON'&&document.contains(lastFocus)){ try{ lastFocus.focus({preventScroll:true}); }catch(e){} }
}
$('#scrim').addEventListener('click',e=>{ if(e.target.id==='scrim') closeSheet(); });
$('#sheet').addEventListener('click',e=>{ if(e.target.closest('[data-close]')) closeSheet(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

function confirmSheet(o){
  return new Promise(res=>{
    let done=false; const fin=v=>{ if(!done){ done=true; res(v); } };
    openSheet(`<div class="sh-head"><h2 id="sheetTitle">${esc(o.title)}</h2></div><p class="sub">${esc(o.text)}</p><div class="btnrow"><button class="btn ghost" id="cfNo">Annulla</button><button class="btn ${o.danger?'danger':'primary'}" id="cfYes">${esc(o.ok)}</button></div>`,()=>fin(false));
    $('#cfNo').onclick=()=>closeSheet();
    $('#cfYes').onclick=()=>{ fin(true); closeSheet(); };
  });
}

    const box=$('#rSuggest'); if(!box) return;
    const src=m.roster.length?null:sameOpp(m).filter(x=>x.roster.length).sort((a,b)=>b.created-a.created)[0];
    box.innerHTML=src?`<button class="suggest" id="useSrc">${IC.plus}<span>Usa la rosa della partita del ${fmtDate(src.date)}: ${src.roster.map(n=>'#'+n).join(' ')}</span></button>`:'';
    if(src) $('#useSrc').onclick=()=>{ m.roster=src.roster.slice(); save(); drawGrid(); drawSuggest(); };
  };
  drawGrid(); drawSuggest();
  $('#oppIn').addEventListener('input',e=>{ m.opp=e.target.value.slice(0,40); save(); renderHeader(); drawSuggest(); });
  $('#oppIn').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); e.target.blur(); } });
  $('#numGrid').addEventListener('click',e=>{
    const b=e.target.closest('.nb'); if(!b) return;
    const n=b.dataset.n, i=m.roster.indexOf(n);
    if(i>=0) m.roster.splice(i,1); else{ m.roster.push(n); m.roster.sort(numSort); }
    save(); b.setAttribute('aria-pressed',String(i<0)); drawSuggest(); countR();
  });
}

/* partite */
function openMatches(){
  const list=Object.values(db.matches).sort((a,b)=>b.created-a.created);
  openSheet(`<div class="sh-head"><h2 id="sheetTitle">Le tue partite</h2>${closeBtn()}</div><button class="btn primary block" id="newMatch">${IC.plus}<span>Nuova partita</span></button><ul class="mlist">${list.map(m=>`<li><button class="mrow" data-open="${m.id}"${m.id===db.cur?' aria-current="true"':''}><span class="mt">${esc(m.opp.trim()||'Senza nome')}</span><span class="mm">${fmtDate(m.date)}, ${att(m.ev.length)}${m.id===db.cur?', <span class="open">aperta ora</span>':''}</span></button><button class="iconbtn" data-delm="${m.id}" aria-label="Elimina la partita">${IC.trash}</button></li>`).join('')}</ul>`);
  $('#newMatch').onclick=()=>{ const m=newMatch(''); db.matches[m.id]=m; db.cur=m.id; filter='match'; resetSel(); flash=null; save(); renderAll(); openRoster(true); };
  $('.mlist').addEventListener('click',e=>{
    const o=e.target.closest('[data-open]'), d=e.target.closest('[data-delm]');
    if(o){ db.cur=o.dataset.open; filter='match'; resetSel(); flash=null; save(); closeSheet(); renderAll(); return; }
    if(!d) return;
    const m=db.matches[d.dataset.delm]; if(!m) return;
    const undo=()=>{ db.matches[m.id]=m; unmarkDeleted(m.id); save(); renderAll(); if(!$('#scrim').hidden) openMatches(); };
    if(!m.ev.length){ deleteMatch(m.id); openMatches(); toast('Partita eliminata.','Ripristina',undo); return; }
    confirmSheet({title:'Eliminare la partita?',text:`${m.opp.trim()?'Contro '+m.opp.trim():'Senza nome'}, ${att(m.ev.length)}. Se ti servono ancora, copia prima il backup da Condividi.`,ok:'Elimina',danger:true}).then(ok=>{
      if(!ok){ openMatches(); return; }
      deleteMatch(m.id); openMatches();
      toast('Partita eliminata.','Ripristina',undo);
    });
  });
}
function deleteMatch(id){
  delete db.matches[id]; markDeleted(id);
  if(db.cur===id){
    const rest=Object.values(db.matches).sort((a,b)=>b.created-a.created);
    if(rest.length) db.cur=rest[0].id; else{ const n=newMatch(''); db.matches[n.id]=n; db.cur=n.id; }
    filter='match'; resetSel(); flash=null;
  }
  save(); renderAll();
}

/* cronologia */
function openHistory(){
  const m=cur();
  const draw=()=>{
    const box=$('#histBody'); if(!box) return;
    if(!m.ev.length){ box.innerHTML='<p class="sub">Nessun attacco registrato in questa partita.</p>'; return; }
    const bySet={}; m.ev.forEach(e=>{ (bySet[e.s]=bySet[e.s]||[]).push(e); });
    box.innerHTML=Object.keys(bySet).sort((a,b)=>b-a).map(s=>`<h3 class="hist-set">Set ${s}, ${att(bySet[s].length)}</h3><ul class="hlist">${bySet[s].slice().reverse().map(e=>`<li><span class="dot" style="background:${OV[e.o]}"></span><span class="hn">${e.n==='?'?'?':'#'+esc(e.n)}</span><span class="ht">${esc(cap(shotName(e.z,e.d)))}<small>${OC[e.o]}</small></span><button class="iconbtn" data-del="${e.id}" aria-label="Elimina questo attacco">${IC.trash}</button></li>`).join('')}</ul>`).join('');
  };
  openSheet(`<div class="sh-head"><h2 id="sheetTitle">Cronologia</h2>${closeBtn()}</div><div id="histBody"></div>`,()=>{ renderAll(); });
  draw();
  $('#histBody').addEventListener('click',e=>{
    const b=e.target.closest('[data-del]'); if(!b) return;
    const ev=m.ev.find(x=>x.id===b.dataset.del); if(!ev) return;
    removeEvent(m.id,ev.id); draw();
    toast('Eliminato: '+evText(ev),'Ripristina',()=>{ restoreEvent(m.id,ev); draw(); renderAll(); });
  });
}

/* ---------- avvisi ---------- */
let toastT=0;
function toast(msg,actLabel,actFn){
  const t=$('#toast'), b=$('#toastAct');
  $('#toastMsg').textContent=msg;
  if(actLabel){ b.hidden=false; b.textContent=actLabel; b.onclick=()=>{ hideToast(); actFn(); }; }
  else{ b.hidden=true; b.onclick=null; }
  t.style.top=Math.round($('.appbar').getBoundingClientRect().bottom+10)+'px';
  t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(hideToast,actLabel?5200:3200);
}
function hideToast(){ $('#toast').classList.remove('show'); }

/* ---------- avvio ---------- */
buildCourt();
(function(){ const sp=$('#splash'); if(!sp) return; let seen=false; try{ seen=!!sessionStorage.getItem('scout-splash'); sessionStorage.setItem('scout-splash','1'); }catch(e){}
  if(seen||reduced){ sp.remove(); return; } sp.classList.add('run'); setTimeout(()=>sp.remove(),1300); })();
requestAnimationFrame(moveInd);
try{ if(document.fonts) document.fonts.ready.then(moveInd); }catch(e){}
renderHeader();
show('scout');
if(GH){
  try{ if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
  window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; if(view==='share') renderShare(); });
  window.addEventListener('appinstalled',()=>{ installEvt=null; if(view==='share') renderShare(); toast('App installata: da ora aprila dall’icona sulla Home.'); });
  let hinted=false; try{ hinted=!!localStorage.getItem('scout-install-hint'); }catch(e){}
  if(!isStandalone()&&!hinted) setTimeout(()=>{ try{ localStorage.setItem('scout-install-hint','1'); }catch(e){} toast('Consiglio: mettila sulla schermata Home, così non perdi mai i dati.','Come',doInstall); },1500);
}
initCloud().finally(()=>{ if(!storageOK&&cloud.state!=='on') toast('Qui i dati non vengono salvati: prima di chiudere copia il backup da Condividi.'); });
})();
</script>
