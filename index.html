<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1828" media="(prefers-color-scheme: dark)">
<meta name="description" content="Scout dell'attacco nella pallavolo: le avversarie, la tua squadra e il confronto.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scout">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Scout · fogli di stile
   Un solo colore forte per lato: campo blu = attaccano loro,
   campo arancio = attacchiamo noi. Il resto resta neutro.
   ========================================================= */
:root{
  --bg:#EEF2F7;--surface:#FFFFFF;--surface-2:#F5F7FB;--sunken:#E6ECF3;
  --ink:#0D1B2E;--ink-2:#3C4B61;--muted:#637287;--line:#D8E0EA;--line-2:#C3CEDC;
  --court-L:#1F5FB0;--court-N:#E2621B;--accent:#1F5FB0;
  --ball:#FFC72C;--ball-ink:#2A1E00;--ball-edge:#D29E00;
  --red:#DE3548;--green:#119B67;--gold:#F0AE1C;--gold-ink:#2B2000;--slate:#7E8A9B;--steel:#4F72AB;
  --warn:#E58A1F;--calm:#5B8BD0;--step-ok:#3C4B61;
  --d-fill:#DCE6F2;--d-fill2:#ECF1F8;--d-line:#FFFFFF;--d-net:#1B2D45;--d-text:#5E6F84;
  --scrim:rgba(8,16,30,.48);--toast:#13233A;
  --shadow:0 1px 0 rgba(13,27,46,.04),0 8px 24px -16px rgba(13,27,46,.35);
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-lg:18px;--r-md:12px;--r-sm:9px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09111D;--surface:#101B2B;--surface-2:#152338;--sunken:#0C1726;
  --ink:#E6EDF6;--ink-2:#B4C1D3;--muted:#8D9CB2;--line:#21314A;--line-2:#2D4060;
  --court-L:#1A4F94;--court-N:#B9511A;--accent:#5B95E3;
  --red:#F0566A;--green:#2DB781;--gold:#F4BE3C;--slate:#8C97A8;--steel:#7B9DD6;--warn:#F09A3A;--calm:#6E9CDF;--step-ok:#34507A;
  --d-fill:#1A3150;--d-fill2:#13253D;--d-line:#2D4A70;--d-net:#C8D6E7;--d-text:#8EA0B7;
  --scrim:rgba(0,4,12,.62);--toast:#22395A;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px -16px rgba(0,0,0,.7);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#09111D;--surface:#101B2B;--surface-2:#152338;--sunken:#0C1726;
  --ink:#E6EDF6;--ink-2:#B4C1D3;--muted:#8D9CB2;--line:#21314A;--line-2:#2D4060;
  --court-L:#1A4F94;--court-N:#B9511A;--accent:#5B95E3;
  --red:#F0566A;--green:#2DB781;--gold:#F4BE3C;--slate:#8C97A8;--steel:#7B9DD6;--warn:#F09A3A;--calm:#6E9CDF;--step-ok:#34507A;
  --d-fill:#1A3150;--d-fill2:#13253D;--d-line:#2D4A70;--d-net:#C8D6E7;--d-text:#8EA0B7;
  --scrim:rgba(0,4,12,.62);--toast:#22395A;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px -16px rgba(0,0,0,.7);
  color-scheme:dark;}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font);font-stretch:100%;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit;font-stretch:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.court :focus-visible{outline-color:var(--ball)}
h1,h2,h3,p{margin:0}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-stretch:68%;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- impalcatura ---------- */
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
main{position:relative;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;container:main/inline-size;padding-bottom:env(safe-area-inset-bottom,0px)}
.view{width:100%;max-width:1360px;margin:0 auto;padding:14px 16px 40px}

/* ---------- barra (telefono) / colonna (PC) ---------- */
.appbar{position:relative;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top,0px) 12px 0}
.brand,.rail-foot{display:none}
.bar-row{display:flex;align-items:center;gap:8px;min-height:52px}
.matchbtn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 6px 6px 2px;border-radius:var(--r-sm);text-align:left}
.matchbtn .mb-t{min-width:0;display:flex;flex-direction:column}
.matchbtn .mb-k{font-size:12.5px;color:var(--muted);line-height:1.2}
.matchbtn .mb-n{font-weight:700;font-size:20px;line-height:1.15;font-stretch:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.matchbtn .i{color:var(--muted)}
.sets{flex:none;display:flex;align-items:center;gap:3px;padding:3px;border-radius:11px;background:var(--sunken)}
.sets .lab{font-size:12.5px;color:var(--muted);padding:0 4px 0 6px}
.sets button{width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);font-size:16px}
.sets button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(13,27,46,.18)}
.tabs{position:relative;display:flex;margin:0 -4px}
.tabs button{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:7px;min-width:0;border:0;background:none;color:var(--muted);font-weight:600;font-size:14.5px;padding:11px 4px 12px;white-space:nowrap;transition:color .15s}
.tabs button .i{width:17px;height:17px}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs .ind{position:absolute;left:0;bottom:-1px;height:3px;width:var(--tw,0);border-radius:3px 3px 0 0;background:var(--ink);transform:translateX(var(--tx,0));transition:transform .28s cubic-bezier(.3,.7,.3,1),width .28s}
@media (max-width:360px){.tabs button .i{display:none}.sets .lab{display:none}}

@media (min-width:1024px){
  .app{grid-template-columns:244px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  .appbar{display:flex;flex-direction:column;gap:18px;border-bottom:0;border-right:1px solid var(--line);padding:22px 16px 18px;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px}
  .brand svg{width:30px;height:30px}
  .brand b{font-size:22px;font-weight:800;font-stretch:72%;letter-spacing:.01em}
  .bar-row{flex-direction:column;align-items:stretch;gap:14px}
  .matchbtn{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2)}
  .matchbtn:hover{border-color:var(--line-2)}
  .sets{justify-content:space-between}
  .sets button{flex:1}
  .tabs{flex-direction:column;margin:0;gap:2px}
  .tabs button{justify-content:flex-start;gap:12px;padding:11px 12px;border-radius:10px;font-size:15px}
  .tabs button:hover{background:var(--surface-2);color:var(--ink)}
  .tabs button[aria-selected="true"]{background:var(--sunken)}
  .tabs .ind{display:none}
  .rail-foot{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding:0 6px;font-size:12.5px;color:var(--muted)}
  .rail-foot .savedot{display:flex;gap:8px;align-items:flex-start;line-height:1.35}
  .rail-foot .savedot::before{content:"";flex:none;width:8px;height:8px;margin-top:5px;border-radius:50%;background:var(--slate)}
  .rail-foot .savedot.ok::before{background:var(--green)}
  .linkbtn.kb{align-self:flex-start;padding:0}
}

/* ---------- elementi comuni ---------- */
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:14.5px;padding:6px 2px;border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:var(--r-md);border:0;font-weight:600;font-size:15.5px;line-height:1.15;background:var(--surface-2);color:var(--ink);text-align:center;transition:transform .1s ease,background-color .15s,box-shadow .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);color:var(--surface)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2)}
.btn.danger{background:var(--red);color:#fff}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
@media (hover:hover){.btn.primary:hover{background:color-mix(in srgb,var(--ink) 86%,var(--accent))}.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink-2)}}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .btn{flex:1}
.iconbtn{flex:none;width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn .i{width:18px;height:18px}
.seg{display:flex;gap:3px;padding:3px;border-radius:12px;background:var(--sunken)}
.seg button{flex:1 1 0;min-width:0;border:0;border-radius:9px;background:none;color:var(--ink-2);font-weight:600;font-size:14.5px;padding:9px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background-color .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(13,27,46,.16)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:7px 13px;font-weight:600;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.field{display:block}
.field>span{display:block;font-size:13px;color:var(--muted);margin:0 0 5px 2px}
.input,.field input,select.input{width:100%;height:46px;padding:0 13px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface-2);font-size:16px}
.input:focus,.field input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.sub{color:var(--muted);font-size:14.5px}
.tiny{font-size:13px;color:var(--muted);line-height:1.4}
.empty{text-align:center;padding:36px 18px 24px;color:var(--muted)}
.empty .ill{width:140px;margin:0 auto 16px}
.empty h3{color:var(--ink);font-size:22px;font-weight:700;font-stretch:80%;margin-bottom:6px}
.empty p{margin:0 auto 16px;max-width:36ch;font-size:15px}

/* ---------- SCOUT ---------- */
.scout{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto 1fr;grid-template-areas:"side" "who" "court" "dock";min-height:100%;padding-bottom:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.scout[data-side="L"]{--court:var(--court-L)}
.scout[data-side="N"]{--court:var(--court-N)}
.sc-side{grid-area:side}.sc-who{grid-area:who}.sc-court{grid-area:court}.sc-dock{grid-area:dock;align-self:end}
.blk-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 2px 7px}
.blk-h h2{font-size:14px;font-weight:600;color:var(--muted)}
.blk-h .hint{font-size:12.5px;color:var(--muted);text-align:right}
.sc-court .blk-h{display:none}
@media (min-height:880px){.sc-court .blk-h{display:flex}}
.starter:not([hidden])+.blk-h{display:none}

/* chi attacca: interruttore di lato */
.sideswitch{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--sunken)}
.sideswitch button{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;height:44px;border:0;border-radius:11px;background:transparent;color:var(--ink-2);font-weight:600;font-size:14.5px;padding:0 10px;transition:background-color .2s,color .2s}
.sideswitch button i{flex:none;width:10px;height:10px;border-radius:3px;background:var(--sw)}
.sideswitch button span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sideswitch button[data-side="L"]{--sw:var(--court-L)}
.sideswitch button[data-side="N"]{--sw:var(--court-N)}
.sideswitch button[aria-checked="true"]{background:var(--sw);color:#fff}
.sideswitch button[aria-checked="true"] i{background:#fff}
.sideswitch button.hint::after{content:"";position:absolute;inset:-2px;border-radius:13px;border:2px solid var(--sw);opacity:0}
@media (prefers-reduced-motion:no-preference){.sideswitch button.hint::after{animation:ring 1.4s ease-out 2}}
@keyframes ring{0%{opacity:.9;transform:scale(.96)}100%{opacity:0;transform:scale(1.04)}}

.starter{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px dashed var(--line-2);border-radius:14px;padding:12px 12px 12px 14px;margin-bottom:10px}
.starter b{display:block;font-size:15.5px}
.starter p{font-size:13.5px;color:var(--muted);line-height:1.35;margin-top:1px}
.starter .btn{flex:none;min-height:40px;padding:0 14px}

/* maglie */
.jerseys{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:4px 4px;border-radius:12px;transition:box-shadow .2s}
.jersey{position:relative;height:54px;border:0;background:none;padding:0;color:var(--ink);border-radius:12px;display:flex;flex-direction:column;align-items:center}
.shirt{width:56px;height:50px;overflow:visible;display:block;flex:none}
.shirt path{fill:var(--surface);stroke:var(--line-2);stroke-width:1.6;stroke-linejoin:round;transition:fill .12s,stroke .12s}
.jersey .jn{position:absolute;left:0;right:0;top:15px;text-align:center;font-size:22px;line-height:1;pointer-events:none}
.jersey .nm{position:absolute;left:-2px;right:-2px;top:41px;text-align:center;font-size:10.5px;font-weight:600;line-height:1.1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.jerseys.named .jersey{height:66px}
.jersey[aria-pressed="true"] .shirt path{fill:var(--ball);stroke:var(--ball-edge)}
.jersey[aria-pressed="true"] .jn{color:var(--ball-ink)}
.jersey[aria-pressed="true"] .nm{color:var(--ink)}
.jersey.unknown .shirt path{fill:transparent;stroke-dasharray:3.5 3}
.jersey.unknown[aria-pressed="true"] .shirt path{fill:var(--ball)}
.jersey .cnt{position:absolute;top:-4px;left:calc(50% + 13px);min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--ink-2);color:var(--surface);font-size:12px;font-weight:700;line-height:19px;text-align:center;box-shadow:0 0 0 2px var(--bg)}
.jersey .cnt.hot{background:var(--red);color:#fff}
.scout[data-side="N"] .jersey .cnt.hot{background:var(--green)}

/* campo */
.court{container:court/inline-size;position:relative;border-radius:var(--r-lg);padding:0 6px 6px;color:#fff;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.12),transparent 60%),repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px),linear-gradient(180deg,var(--court),color-mix(in srgb,var(--court) 80%,#000));
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),0 12px 26px -16px color-mix(in srgb,var(--court) 70%,#000);transition:background-color .25s,box-shadow .2s}
.net{position:relative;height:14px;margin:0 -6px;box-shadow:inset 0 3px 0 #fff;border-bottom:3px solid #fff;background:repeating-linear-gradient(45deg,rgba(255,255,255,.2) 0 1px,transparent 1px 5px),repeating-linear-gradient(-45deg,rgba(255,255,255,.2) 0 1px,transparent 1px 5px),#0F2340}
.net .ant{position:absolute;top:-3px;bottom:-3px;width:5px;border-radius:3px;background:repeating-linear-gradient(180deg,#E3342F 0 4px,#fff 4px 8px);box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.net .ant.l{left:14px}.net .ant.r{right:14px}
.front{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.zone{display:flex;flex-direction:column;gap:7px;padding:7px 4px 9px;min-width:0}
.front .zone+.zone{border-left:1.5px dashed rgba(255,255,255,.3)}
.zh{display:flex;align-items:baseline;gap:6px;padding:0 3px 1px;white-space:nowrap;min-width:0}
.zh b{font-size:22px;font-weight:800;font-stretch:68%;line-height:1}
.zh span{font-size:12.5px;font-weight:500;opacity:.82;overflow:hidden;text-overflow:ellipsis}
.back{position:relative;display:grid;grid-template-columns:1fr 1fr;border-top:2px solid #fff;margin:4px -6px 0;padding:12px 4px 2px}
.bgrp{min-width:0;padding:0 4px}
.bgrp+.bgrp{border-left:1.5px dashed rgba(255,255,255,.3)}
.bgrp .zh{padding-bottom:6px}
.l3{position:absolute;top:-9px;left:50%;transform:translateX(-50%);padding:0 8px;background:var(--court);border-radius:6px;font-size:11px;font-weight:600;line-height:16px;white-space:nowrap;opacity:.9}
.brow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.shot{position:relative;display:flex;align-items:center;gap:6px;min-width:0;min-height:42px;padding:0 8px;border-radius:var(--r-sm);border:1px solid rgba(255,255,255,.24);color:#fff;font-weight:600;font-size:15px;font-stretch:84%;line-height:1;text-align:left;
  background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.07));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 4px -2px rgba(0,0,0,.35);transition:background-color .12s,color .12s,border-color .12s,transform .08s}
.shot:active{transform:scale(.97)}
@media (hover:hover){.shot:hover{border-color:rgba(255,255,255,.55)}}
.si{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.shot .lab{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot .l2,.shot .l3{display:none}
.shot.bk{justify-content:center;gap:4px;padding:0 3px}
.shot.bk .lab{flex:none;font-size:20px;font-weight:800;font-stretch:68%;overflow:visible}
.shot[aria-pressed="true"]{background:var(--ball);border-color:var(--ball);color:var(--ball-ink);box-shadow:0 0 0 2px rgba(255,255,255,.9),0 6px 16px -4px rgba(255,199,44,.7)}
.tally{position:absolute;top:-7px;right:-5px;z-index:1;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#fff;color:#0D1B2E;font-size:12px;font-weight:700;font-stretch:90%;line-height:19px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tally:empty{display:none}
.tally.hot{background:var(--red);color:#fff}
.scout[data-side="N"] .tally.hot{background:var(--green)}
@container court (max-width:410px){.shot .l1{display:none}.shot .l2{display:inline}.zh span{font-size:11.5px}}
@container court (max-width:320px){.shot .l2{display:none}.shot .l3{display:inline}.shot{padding:0 6px;gap:4px}.zh span{display:none}}

/* esiti e stato */
.sc-dock{position:sticky;bottom:0;z-index:3;margin:0 -16px;padding:8px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -10px 24px -14px rgba(13,27,46,.25)}
main:has(.scout:not([hidden])){padding-bottom:0}
.status{position:relative;isolation:isolate;display:flex;align-items:center;gap:2px;min-height:46px;margin-bottom:8px;padding:0 2px 0 10px;border-radius:11px;font-size:14px;line-height:1.25}
.status::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--flash,transparent);opacity:.14;transition:background-color .2s}
.status .txt{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.status.building .txt{display:block}
.status .txt .i{display:inline-block;vertical-align:-3px;margin-right:5px;color:var(--green)}
.status b{font-weight:600}
.status .mut{color:var(--muted)}
.act{flex:none;display:inline-flex;align-items:center;gap:5px;border:0;background:none;color:var(--accent);font-weight:600;font-size:14.5px;padding:10px 8px;border-radius:9px}
.act.hist{color:var(--muted);font-weight:700;font-stretch:80%;font-size:16px}
.act.clr{width:42px;justify-content:center;color:var(--muted)}
.act.go{background:var(--ball);color:var(--ball-ink);padding:9px 14px;font-weight:700}
.prog{display:flex;gap:5px;min-width:0}
.step{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;height:32px;padding:0 6px;border-radius:9px;border:1.5px dashed var(--line-2);color:var(--muted);font-weight:600;font-size:13.5px;font-stretch:84%;white-space:nowrap;overflow:hidden}
.step:nth-child(2){flex-grow:1.5}
.step i,.step b{font-style:normal;overflow:hidden;text-overflow:ellipsis}
.step.ok{border:1.5px solid var(--sc,var(--step-ok));background:var(--sc,var(--step-ok));color:#fff}
.step.ok.dk{color:var(--gold-ink)}
.step.nx{border:2px solid var(--ball-edge);color:var(--ink);background:color-mix(in srgb,var(--ball) 22%,transparent)}
.outs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;border-radius:15px;transition:box-shadow .2s}
.out{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;min-height:60px;padding:4px 2px;border:0;border-radius:13px;background:var(--oc);color:#fff;font-weight:700;font-size:16.5px;font-stretch:82%;line-height:1.1;white-space:nowrap;
  background-image:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0) 50%,rgba(0,0,0,.08));box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 4px 10px -6px rgba(0,0,0,.5);transition:transform .08s,box-shadow .15s}
.out.dk{color:var(--gold-ink)}
.out:active{transform:scale(.98)}
.out .oi{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
.out .ol{display:flex;flex-direction:column;align-items:center;min-width:0;max-width:100%}
.out .ol b{font-weight:700}
.out .ol small{font-size:12px;font-weight:600;font-stretch:90%;opacity:.88}
.out .oc{position:absolute;top:4px;right:4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:rgba(0,0,0,.2);font-size:11.5px;line-height:18px;font-stretch:90%}
.out .oc:empty{display:none}
.out .ok{display:none;margin-left:2px;padding:1px 6px;border-radius:5px;background:rgba(0,0,0,.18);font-size:12px;font-weight:700;font-stretch:100%}
.out[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--ink)}
@media (max-width:359px){.out .oi{display:none}.out{font-size:15px}}
.jerseys.next{box-shadow:0 0 0 4px var(--bg),0 0 0 6.5px var(--ball)}
.court.next{box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),0 0 0 3px var(--bg),0 0 0 6px var(--ball)}
.outs.next{box-shadow:0 0 0 3px var(--surface),0 0 0 5.5px var(--ball)}
.feed,.kbd{display:none}

@media (prefers-reduced-motion:no-preference){
  .jersey[aria-pressed="true"] .shirt{animation:pop .2s ease-out}
  .shot[aria-pressed="true"]{animation:pop .18s ease-out}
  .status.pop .txt{animation:rise .3s ease-out}
  .out.fired{animation:flash .5s ease-out}
  .jerseys.next,.court.next,.outs.next{animation:nudge 1.6s ease-in-out 2}
}
@keyframes pop{from{transform:scale(.9)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes flash{0%{filter:brightness(1.45)}100%{filter:none}}
@keyframes nudge{50%{filter:brightness(1.04)}}
.fly{position:fixed;left:0;top:0;z-index:55;width:24px;height:24px;pointer-events:none;filter:drop-shadow(0 0 7px var(--c)) drop-shadow(0 3px 3px rgba(0,0,0,.35));will-change:transform}
.fly svg{width:100%;height:100%;display:block}

/* telefono basso: tutto in uno schermo */
@media (max-height:760px){
  .scout{gap:9px}.view.scout{padding-top:10px}
  .jersey{height:48px}.shirt{width:50px;height:45px}.jersey .jn{top:13px;font-size:20px}.jersey .nm{top:36px}.jerseys.named .jersey{height:58px}
  .shot{min-height:37px}.zone{gap:6px;padding:5px 4px 7px}.zh b{font-size:20px}
  .sc-dock{padding-top:6px}.status{min-height:42px;margin-bottom:6px}.out{min-height:54px}
  .sideswitch button{height:40px}
}
@media (max-height:680px){
  .sc-who .blk-h,.sc-court .blk-h{display:none}
  .shot{min-height:34px}.out{min-height:50px}.out .oi{display:none}.status{min-height:40px}
  .jersey{height:44px}.shirt{width:46px;height:41px}.jersey .jn{top:12px;font-size:18px}.jersey .nm{display:none}.jerseys.named .jersey{height:44px}
  .sideswitch button{height:36px}
}

@media (max-height:600px) and (orientation:portrait){
  .appbar .bar-row{min-height:44px}.matchbtn .mb-k{display:none}.tabs button{padding:8px 4px 9px}
  .view.scout{padding-top:8px}.scout{gap:7px}
  .sideswitch{padding:3px}.sideswitch button{height:32px}
  .shot{min-height:31px}.zone{gap:5px;padding:4px 3px 6px}.zh b{font-size:17px}.back{padding-top:9px}
  .out{min-height:46px}.status{min-height:38px;margin-bottom:5px}
}
/* telefono in orizzontale: campo a sinistra, esiti a destra */
@media (orientation:landscape) and (max-height:520px){
  .appbar{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .appbar .bar-row{min-height:44px}.matchbtn .mb-k{display:none}
  .tabs{grid-column:1/-1}.tabs button{padding:7px 4px 8px}
  .view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .scout{grid-template-columns:minmax(0,1fr) minmax(230px,34%);grid-template-rows:auto auto 1fr;grid-template-areas:"side dock" "who dock" "court dock";column-gap:14px;align-content:start;padding-bottom:20px}
  .sc-dock{grid-row:1/-1;position:sticky;top:8px;bottom:auto;align-self:start;margin:0;padding:10px;border:1px solid var(--line);border-radius:var(--r-lg)}
  .outs{grid-template-columns:1fr 1fr}
  .sc-who .blk-h{display:flex}
}
/* tablet: campo + pannello */
@container main (min-width:720px){
  .view{padding:20px 24px 48px}
  .scout{grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto auto 1fr;grid-template-areas:"side dock" "who dock" "court dock";align-items:start;align-content:start;column-gap:20px;row-gap:14px;padding-bottom:28px}
  .sc-dock{grid-row:1/-1}
  .sc-court .blk-h{display:flex}
  .sc-dock{position:sticky;top:20px;bottom:auto;align-self:start;margin:0;padding:14px;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
  .outs{grid-template-columns:1fr;gap:8px}
  .out{flex-direction:row;gap:10px;min-height:58px;justify-content:flex-start;padding:0 16px;font-size:18px}
  .out .oi{width:20px;height:20px;display:block}
  .out .ol{flex-direction:row;gap:5px;align-items:baseline}
  .out .ol small{font-size:18px;font-weight:700;font-stretch:82%;opacity:1}
  .out .ok{display:inline-block;margin-left:auto}
  .out .oc{position:static;margin-left:2px}
  .status{min-height:64px;align-items:center}
  .status .txt{-webkit-line-clamp:3}
  .prog{flex-direction:column;gap:4px;width:100%}
  .status.building{padding:6px}
  .step{flex:0 0 auto;height:30px;justify-content:flex-start;padding:0 10px}
  .step:nth-child(2){flex-grow:0}
  .feed{display:block;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
  .kbd{display:block}
  .shot{min-height:50px}
}
@container main (min-width:1120px){
  .scout{grid-template-columns:260px minmax(0,1fr) 318px;grid-template-rows:auto 1fr;grid-template-areas:"side court dock" "who court dock";column-gap:24px}
  .sc-side{align-self:start}
  .sideswitch{grid-template-columns:1fr}
  .sideswitch button{justify-content:flex-start;padding:0 14px}
  .jerseys{grid-template-columns:repeat(4,minmax(0,1fr))}
  .shot{min-height:56px;font-size:16px}
  .zh b{font-size:26px}
  .court{padding:0 8px 8px}
  .zone{gap:9px;padding:10px 6px 12px}
}
@media (pointer:coarse){.kbd,.out .ok{display:none!important}}
@container main (min-width:1120px){@media (min-height:860px){.scout .shot{min-height:clamp(60px,calc((100vh - 330px)/5),84px)}.scout .zh b{font-size:28px}}}
.feed h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
.flist{list-style:none;margin:0;padding:0;max-height:min(40vh,320px);overflow-y:auto}
.flist li{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.25}
.flist li:last-child{border-bottom:0}
.flist .sd{flex:none;width:4px;align-self:stretch;border-radius:2px}
.flist .fw{flex:none;min-width:38px;font-size:17px}
.flist .ft{flex:1;min-width:0}
.flist .ft small{display:block;color:var(--muted);font-size:12px}
.flist .iconbtn{width:30px;height:30px}
.flist .iconbtn .i{width:15px;height:15px}
.kbd{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.6}
kbd{display:inline-block;min-width:20px;padding:0 5px;border-radius:5px;border:1px solid var(--line-2);border-bottom-width:2px;background:var(--surface-2);font:600 11.5px/18px var(--font);text-align:center;color:var(--ink-2)}

/* ---------- ANALISI ---------- */
.an-top{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.an-top .seg{max-width:460px}
.sech{margin:26px 2px 10px;font-size:20px;font-weight:700;font-stretch:84%;line-height:1.2}
.sech:first-child{margin-top:4px}
.sech small{display:block;margin-top:2px;font-size:13.5px;font-weight:400;font-stretch:100%;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;border-radius:var(--r-lg);overflow:hidden;background:var(--line);border:1px solid var(--line)}
.kpi{background:var(--surface);padding:12px 14px}
.kpi b{display:block;font-size:28px;line-height:1.05}
.kpi span{display:block;margin-top:2px;font-size:12.5px;color:var(--muted);line-height:1.25}
.kpi b.bad{color:var(--red)}.kpi b.good{color:var(--green)}
@container main (min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.todo{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.todo li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tc,var(--ink-2));border-radius:var(--r-md)}
.todo li b{display:block;font-size:15.5px;line-height:1.25}
.todo li p{font-size:14px;color:var(--ink-2);margin-top:2px;line-height:1.38}
.todo .tg{display:inline-block;margin-right:7px;padding:1px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;font-weight:700;font-stretch:80%;line-height:1.3}
@container main (min-width:900px){.todo{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@container main (min-width:760px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container main (min-width:1180px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px}
.pcard.top{border-color:color-mix(in srgb,var(--rk) 55%,var(--line))}
.pc-head{display:flex;align-items:center;gap:12px}
.bj{position:relative;flex:none;display:block;width:58px;height:52px}
.bj .shirt{width:58px;height:52px}
.bj .shirt path{fill:var(--ink-2);stroke:var(--ink-2)}
.bj .jn{position:absolute;left:0;right:0;top:15px;text-align:center;color:var(--surface);font-size:23px;line-height:1}
.bj.unknown .shirt path{fill:var(--slate);stroke:var(--slate)}
.pc-id{flex:1;min-width:0}
.pc-id .rk{font-size:12.5px;font-weight:700;color:var(--rk)}
.pc-id h3{font-size:18px;font-weight:700;font-stretch:84%;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-id p{font-size:13px;color:var(--muted)}
.pc-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}
.pc-k b{display:block;font-size:24px;line-height:1.05}
.pc-k span{display:block;font-size:12px;color:var(--muted);line-height:1.25}
.obar{display:flex;gap:2px;height:8px;border-radius:5px;overflow:hidden;background:var(--line);margin:12px 0 2px}
.obar span{display:block;height:100%}
.obar.mini{height:5px;gap:1px;border-radius:3px;margin:5px 0 0}
.pc-body{display:grid;grid-template-columns:minmax(120px,42%) 1fr;gap:14px;align-items:start;margin-top:12px}
.shotlist{list-style:none;margin:0;padding:0}
.shotlist li{padding:6px 0;border-bottom:1px solid var(--line)}
.shotlist li:last-child{border-bottom:0}
.sl-top{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;line-height:1.25}
.sl-top .n{white-space:nowrap;color:var(--muted)}
.sl-top .n b{color:var(--ink);font-size:16px}
.sl-top .n em{font-style:normal;font-weight:600;color:var(--kc)}
.facts{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line);display:grid;gap:7px}
.facts div{display:grid;grid-template-columns:96px 1fr;gap:8px;font-size:13.5px;line-height:1.35}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:600}
.caveat{margin:12px 0 0;font-size:13px;color:var(--muted);padding:8px 10px;background:var(--surface-2);border-radius:9px}
@container main (max-width:379px){.pc-body{grid-template-columns:1fr}.pc-body .dg{max-width:220px;margin:0 auto}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:0 2px 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%}
.legend i.bar{width:16px;height:4px;border-radius:2px}
.dg-svg{display:block;width:100%;height:auto;overflow:visible}
.dg-svg .dz{font:600 7.4px var(--font);fill:var(--d-text);text-anchor:middle}
.dg-svg .side{font:600 7px var(--font);fill:var(--d-text);text-anchor:middle}
.dg-svg .dour{fill:var(--d-fill)}
.dg-svg .dthr{fill:var(--d-fill2)}
.dg-svg .dln{stroke:var(--d-line);stroke-width:1.2;fill:none}
.dg-svg .dnet{stroke:var(--d-net);stroke-width:2.6;stroke-linecap:round}
.dg-svg .org circle,.dg-svg .org rect{fill:var(--surface);stroke:var(--d-text);stroke-width:.9}
.dg-svg .org text{font:800 8.2px var(--font);font-stretch:70%;fill:var(--d-text);text-anchor:middle}
.dg-svg .org.on circle,.dg-svg .org.on rect{fill:var(--ink-2);stroke:var(--ink-2)}
.dg-svg .org.on text{fill:var(--surface)}
.teamblk{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.teamblk .dg{max-width:280px;width:100%;margin:0 auto}
@container main (min-width:760px){.teamblk{grid-template-columns:280px minmax(0,1fr);align-items:center}}
.costly{list-style:none;margin:0;padding:0}
.costly li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.3}
.costly li:last-child{border-bottom:0}
.costly .k{flex:none;min-width:30px;font-size:26px;line-height:1;color:var(--kc)}
.costly small{display:block;margin-top:2px;color:var(--muted);font-size:13px}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}
th,td{padding:10px 10px;text-align:right;border-bottom:1px solid var(--line)}
th{font-weight:600;font-size:12.5px;color:var(--muted)}
th:first-child,td:first-child{text-align:left;padding-left:14px}
th:last-child,td:last-child{padding-right:14px}
tbody tr:last-child td{border-bottom:0}
td .jn{font-size:18px}
td .pn{margin-left:6px;color:var(--muted);font-size:13px}
td.hot{color:var(--kc);font-weight:700}
td small{margin-left:4px;font-size:12px;font-weight:500;color:var(--muted)}
.btiles{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(132px,max-content);gap:8px;overflow-x:auto;margin:0 -16px 18px;padding:2px 16px 6px;scrollbar-width:none}
.btiles::-webkit-scrollbar{display:none}
@container main (min-width:720px){.btiles{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin:0 0 18px;padding:2px 0 6px}}
.btile{display:flex;align-items:center;gap:10px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);text-align:left}
.btile:hover{border-color:var(--line-2)}
.btile .bt-n{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--ink-2);color:var(--surface);font-size:18px}

.btile small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap}
.btile.tb{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btile.tb .bt-n{background:var(--ball);color:var(--ball-ink)}

/* confronto */
.vs{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@container main (min-width:860px){.vs{grid-template-columns:minmax(300px,380px) minmax(0,1fr);align-items:start}}
.heatwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px}
.heatcap{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.heatcap i{flex:none;width:10px;height:10px;border-radius:3px;background:var(--hc)}
.heatcap small{margin-left:auto;font-weight:400;color:var(--muted)}
.heat{display:block;width:100%;max-width:min(300px,62vw);height:auto;margin:10px auto}
.heat text{font-family:var(--font);text-anchor:middle}
.heat .hz{font-size:9px;font-weight:600}
.heat .hk{font-size:15px;font-weight:800;font-stretch:70%}
.heat .hp{font-size:8.5px;font-weight:600}
.sets-cmp{width:100%}
.sets-cmp td{vertical-align:middle}
.cbar{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.cbar span{display:block;height:8px;border-radius:4px;background:var(--bc);min-width:2px}
.cbar em{font-style:normal;min-width:76px;text-align:right}

/* ---------- SQUADRA ---------- */
.tm{display:grid;gap:16px;max-width:820px}
.tm-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.tm-card h2{font-size:18px;font-weight:700;font-stretch:84%;margin-bottom:4px}
.tm-card>p{font-size:14px;color:var(--muted);margin-bottom:12px}
.tlist{list-style:none;margin:0;padding:0}
.trow{display:grid;grid-template-columns:44px minmax(0,1fr) 38px;grid-template-areas:"num name del" "num meta del";column-gap:10px;row-gap:6px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .tn{grid-area:num;display:grid;place-items:center;width:44px;height:44px;border-radius:11px;background:var(--court-N);color:#fff;font-size:22px}
.trow .tname{grid-area:name;height:40px;font-size:15.5px;font-weight:600}
.trow .tmeta{grid-area:meta;display:flex;gap:10px;align-items:center;min-width:0}
.trow .trole{height:36px;font-size:14px;width:auto;flex:0 1 160px;min-width:0}
.trow .tstat{flex:1;min-width:0;font-size:12.5px;line-height:1.25;color:var(--muted)}
.trow .iconbtn{grid-area:del}
@container main (min-width:720px){
  .trow{grid-template-columns:48px minmax(0,1fr) 180px 150px 38px;grid-template-areas:"num name meta meta del"}
  .trow .tmeta{display:contents}
  .trow .trole{grid-column:3}
  .trow .tstat{grid-column:4;text-align:right}
}
.addf{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;margin-top:12px}
.addf .role{grid-column:1/-1}
.addf .btn{grid-column:1/-1}
@container main (min-width:720px){.addf{grid-template-columns:90px minmax(0,1fr) 180px auto}.addf .role,.addf .btn{grid-column:auto}}

/* ---------- DATI ---------- */
.dgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;max-width:1040px}
@container main (min-width:820px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.dgrid .wide{grid-column:1/-1}}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column}
.scard h2{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:700;font-stretch:84%;margin-bottom:4px}
.scard h2 .i{width:18px;height:18px;color:var(--muted)}
.scard>p{color:var(--muted);font-size:14px;margin-bottom:12px}
.scard .btnrow{margin-top:auto;padding-top:4px}
textarea.paste{display:block;width:100%;min-height:88px;margin-bottom:10px;padding:12px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface-2);font-size:15px;line-height:1.4;resize:vertical}
textarea.paste:focus{outline:none;border-color:var(--accent)}
.cloud{display:flex;align-items:flex-start;gap:9px;margin:0 2px 14px;font-size:14px;line-height:1.4;color:var(--muted)}
.cloud::before{content:"";flex:none;width:9px;height:9px;margin-top:5px;border-radius:50%;background:var(--slate)}
.cloud.ok{color:var(--ink)}.cloud.ok::before{background:var(--green)}
.cloud.loading::before,.cloud.error::before{background:var(--warn)}
.warnbox{background:var(--surface);border:1.5px solid var(--warn);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14.5px}

/* ---------- fogli ---------- */
.scrim{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);opacity:0;transition:opacity .2s}
.scrim.open{opacity:1}
.sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;padding:6px 18px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(30px);transition:transform .24s cubic-bezier(.2,.8,.2,1);outline:none}
.scrim.open .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line-2);margin:4px auto 10px}
@media (min-width:720px){
  .scrim{align-items:center;padding:24px}
  .sheet{border-radius:20px;max-height:min(86vh,900px);padding:18px 22px 22px;transform:translateY(10px) scale(.98);box-shadow:0 30px 80px -30px rgba(0,0,0,.5)}
  .grab{display:none}
}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sh-head h2{font-size:24px;font-weight:700;font-stretch:80%;line-height:1.15}
.numhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:14px 0 8px}
.numcount{font-weight:700;color:var(--accent);white-space:nowrap;font-size:14px}
.numgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.nb{height:clamp(30px,min(8.6vw,4.6vh),40px);min-width:0;padding:0;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-size:clamp(14px,4.2vw,17px)}
.nb[aria-pressed="true"]{background:var(--ball);border-color:var(--ball-edge);color:var(--ball-ink)}

.suggest .i{color:var(--accent)}
.preview{max-height:42vh;overflow:auto;white-space:pre-wrap;word-break:break-word;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45;-webkit-user-select:text;user-select:text}

.mlist{list-style:none;margin:12px 0 0;padding:0}

.mrow{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:0;background:none;padding:12px 4px;text-align:left;border-radius:10px}

.mrow .mm{font-size:13px;color:var(--muted)}
.mrow .open{font-weight:600;color:var(--green)}
.hist-set{margin:14px 2px 4px;font-size:13.5px;font-weight:600;color:var(--muted)}
.hlist{list-style:none;margin:0;padding:0}
.hlist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.hlist .sd{flex:none;width:4px;height:30px;border-radius:2px}
.hlist .dot{flex:none;width:10px;height:10px;border-radius:50%}
.hlist .hn{flex:none;min-width:44px;font-size:19px}
.hlist .ht{flex:1;min-width:0;font-size:14.5px;line-height:1.25}
.hlist .ht small{display:block;color:var(--muted);font-size:12.5px}
.tb-head{margin:0 0 12px;font-size:15px;line-height:1.4}
.tb-sec{margin:16px 0 6px;font-size:17px;font-weight:700;font-stretch:84%}
.tb-list{list-style:none;margin:0;padding:0}
.tb-list li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tb-list li:last-child{border-bottom:0}
.tb-list .pr{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:15px;font-weight:800;font-stretch:80%;color:#fff;background:var(--pc,var(--red))}
.tb-list .pr .i{width:15px;height:15px;stroke:#fff}
.tb-list p{font-size:14px;line-height:1.38;min-width:0;color:var(--ink-2)}

.tb-list .tg{display:inline-block;margin-right:6px;padding:1px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-size:13.5px;font-weight:700;font-stretch:80%;line-height:1.3}
.steps{margin:0 0 4px;padding-left:22px;font-size:15px;line-height:1.45}.steps li{margin:8px 0}
/* QR */
.qrbox{display:grid;place-items:center;gap:10px;margin:4px 0 12px}
.qrframe{width:min(100%,340px);aspect-ratio:1;padding:12px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.qrframe svg{display:block;width:100%;height:100%}
.qrdots{display:flex;gap:6px;justify-content:center}
.qrdots i{width:8px;height:8px;border-radius:50%;background:var(--line-2);transition:background-color .15s}
.qrdots i.on{background:var(--ink)}
.qrmeta{font-size:13.5px;color:var(--muted);text-align:center}
.cam{position:relative;width:100%;aspect-ratio:1;max-height:56vh;border-radius:16px;overflow:hidden;background:#000;margin-bottom:12px}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .aim{position:absolute;inset:14%;border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.9)}
.cam .camtxt{position:absolute;left:12px;right:12px;bottom:12px;padding:8px 12px;border-radius:10px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;text-align:center}
.qprog{display:flex;gap:4px;margin:0 0 10px}
.qprog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.qprog i.on{background:var(--green)}

.toast{position:fixed;left:50%;top:76px;z-index:60;display:flex;align-items:center;gap:12px;max-width:min(92vw,520px);padding:11px 12px 11px 15px;border-radius:13px;background:var(--toast);color:#F3F7FC;font-size:14.5px;line-height:1.35;box-shadow:0 12px 30px rgba(0,0,0,.22);opacity:0;transform:translate(-50%,-8px);transition:opacity .18s,transform .18s;pointer-events:none}

.toast button{flex:none;border:0;background:none;color:var(--ball);font-weight:700;font-size:14.5px;padding:6px 4px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>

function cleanEvent(e){
  if(!e||typeof e!=='object') return null;
  const n=normNum(e.n); if(n===null) return null;
  if(!ZS.includes(e.z)||!DS.includes(e.d)||!OS.includes(e.o)) return null;
  if(!ZD[e.z].includes(e.d)&&!LEGACY.has(e.z+e.d)) return null;
  const s=Math.min(5,Math.max(1,parseInt(e.s,10)||1));
  const t=Number(e.t)>0?Number(e.t):Date.now();
  const id=String(e.id||'').replace(/[^0-9a-z]/gi,'').slice(0,24)||newId();
  return {id,t,n,z:e.z,d:e.d,o:e.o,s,p:e.p==='N'?'N':'L'};
}
function cleanMatch(m){
  if(!m||typeof m!=='object') return null;
  const out={
    id:String(m.id||'').replace(/[^0-9a-z]/gi,'').slice(0,32)||('m'+newId()),
    opp:String(m.opp||'').slice(0,40),
    date:/^\d{4}-\d{2}-\d{2}$/.test(m.date||'')?m.date:todayISO(),
    set:Math.min(5,Math.max(1,parseInt(m.set,10)||1)),
    roster:[],ev:[],alias:[],gone:[],
    created:Number(m.created)>0?Number(m.created):Date.now()
  };
  if(Array.isArray(m.gone)) out.gone=[...new Set(m.gone.map(g=>String(g).replace(/[^0-9a-z]/gi,'')).filter(Boolean))].slice(-1000);
  const seen=new Set(out.gone);
  (Array.isArray(m.ev)?m.ev:[]).forEach(x=>{ const e=cleanEvent(x); if(e&&!seen.has(e.id)){ seen.add(e.id); out.ev.push(e); } });
  out.ev.sort((a,b)=>a.t-b.t);
  const r=new Set();
  (Array.isArray(m.roster)?m.roster:[]).forEach(x=>{ const n=normNum(x); if(n&&n!=='?') r.add(n); });
  out.roster=[...r].sort(numSort);
  if(Array.isArray(m.alias)) out.alias=m.alias.map(a=>String(a).replace(/[^0-9a-z]/gi,'')).filter(Boolean).slice(0,20);
  return out;
}
const newMatch=opp=>cleanMatch({id:'m'+newId(),opp:opp||'',date:todayISO(),created:Date.now()});

// la mia squadra: un registro per numero, vince la modifica più recente (anche tra telefoni)
function cleanTeam(t){
  const out={name:'',at:0,pl:[]};
  if(!t||typeof t!=='object') return out;
  out.name=String(t.name||'').replace(/\s+/g,' ').slice(0,40);
  out.at=Number(t.at)>0?Number(t.at):0;
  const seen=new Map();
  (Array.isArray(t.pl)?t.pl:[]).forEach(x=>{
    if(!x||typeof x!=='object') return;
    const n=normNum(x.n); if(!n||n==='?') return;
    const p={n,nm:String(x.nm||'').replace(/\s+/g,' ').trim().slice(0,24),r:ROLE_KEYS.includes(x.r)?x.r:'',at:Number(x.at)>0?Number(x.at):0};
    if(x.x) p.x=1;
    const o=seen.get(n); if(!o||p.at>=o.at) seen.set(n,p);
  });
  out.pl=[...seen.values()].sort((a,b)=>numSort(a.n,b.n));
  return out;
}
function mergeTeam(t,inc){
  if(!inc) return false;
  let ch=false;
  if((inc.at>t.at&&inc.name!==t.name)||(!t.name&&!t.at&&inc.name)){ t.name=inc.name; t.at=Math.max(t.at,inc.at); ch=true; }
  inc.pl.forEach(p=>{
    const i=t.pl.findIndex(x=>x.n===p.n);
    if(i<0){ t.pl.push(Object.assign({},p)); ch=true; return; }
    const l=t.pl[i];
    if(p.at>l.at&&JSON.stringify(p)!==JSON.stringify(l)){ t.pl[i]=Object.assign({},p); ch=true; }
    else if(!p.at&&!l.x){ // da un codice (senza data): completa solo i campi vuoti
      if(!l.nm&&p.nm){ l.nm=p.nm; ch=true; }
      if(!l.r&&p.r){ l.r=p.r; ch=true; }
    }
  });
  if(ch) t.pl.sort((a,b)=>numSort(a.n,b.n));
  return ch;
}

function readKey(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
function load(){
  const out={v:3,cur:null,matches:{},deleted:[],team:cleanTeam(null),side:'L'};
  let raw=readKey(KEY), v3=true;
  if(!raw||!raw.matches){ raw=readKey(KEY2); v3=false; }      // prima apertura dopo l'aggiornamento: copio i dati della v2, che restano intatti
  if(raw&&raw.matches&&typeof raw.matches==='object'){
    Object.values(raw.matches).forEach(x=>{ const m=cleanMatch(x); if(m) out.matches[m.id]=m; });
    out.cur=raw.cur;
    if(Array.isArray(raw.deleted)) out.deleted=raw.deleted.map(x=>String(x).replace(/[^0-9a-z]/gi,'')).filter(Boolean).slice(-200);
    out.deleted.forEach(id=>{ delete out.matches[id]; });
    if(v3){ out.team=cleanTeam(raw.team); out.side=raw.side==='N'?'N':'L'; }
  }else{
    const old=readKey(KEY1);
    if(old&&Array.isArray(old.ev)&&(old.ev.length||(old.roster||[]).length)){
      const m=cleanMatch({id:'m'+newId(),opp:old.opp,roster:old.roster,ev:old.ev,set:old.set});
      if(m){ out.matches[m.id]=m; out.cur=m.id; }
    }
  }
  if(!out.cur||!out.matches[out.cur]){
    const list=Object.values(out.matches).sort((a,b)=>b.created-a.created);
    if(list.length) out.cur=list[0].id;
    else{ const m=newMatch(''); out.matches[m.id]=m; out.cur=m.id; }
  }
  return out;
}

/* ---------- salvataggio nel tuo account Claude (solo se aperta dentro Claude) ---------- */
const cloud={state:'off',base:null,col:null,pushed:{},drop:new Set(),metaSig:'',busy:false,again:false,fail:0,lastPull:0,quotaWarned:false};
let syncT=0;
function scheduleSync(){ if(cloud.state!=='on') return; clearTimeout(syncT); syncT=setTimeout(syncNow,500); }
function toCloud(m){ const o=packMatch(m); o.v=3; o.a=m.alias.join(','); o.c=m.created; o.g=m.gone.join(','); return o; }
const metaOf=()=>({deleted:db.deleted.slice(-200),team:db.team});
function applyCloud(docs,meta){
  let changed=false;
  const delCloud=meta&&Array.isArray(meta.deleted)?meta.deleted.map(String):[];
  const teamCloud=cleanTeam(meta&&meta.team);
  cloud.metaSig=meta?JSON.stringify({deleted:delCloud.slice(-200),team:teamCloud}):'';
  delCloud.forEach(id=>{ if(!db.deleted.includes(id)){ markDeleted(id); changed=true; } });
  db.deleted.forEach(id=>{ if(db.matches[id]){ delete db.matches[id]; changed=true; } });
  if(mergeTeam(db.team,teamCloud)) changed=true;
  const pristineCur=db.matches[db.cur]&&isPristine(db.matches[db.cur])?db.cur:null;
  docs.forEach(d=>{
    const inc=unpackMatch(d.data()); if(!inc) return;
    cloud.pushed[d.id]=JSON.stringify(d.data());
    if(db.deleted.includes(inc.id)) return;
    const local=findLocal(inc.id);
    if(local){
      const before=JSON.stringify(toCloud(local));
      mergeInto(local,inc);
      if(JSON.stringify(toCloud(local))!==before) changed=true;
      if(local.id!==inc.id) cloud.drop.add(inc.id);
    }else{ db.matches[inc.id]=inc; changed=true; }
  });
  if(!db.matches[db.cur]||(pristineCur&&Object.keys(db.matches).length>1)){
    if(pristineCur&&db.matches[pristineCur]&&isPristine(db.matches[pristineCur])) delete db.matches[pristineCur];
    const list=Object.values(db.matches).sort((a,b)=>b.created-a.created);
    if(list.length) db.cur=list[0].id; else{ const n=newMatch(''); db.matches[n.id]=n; db.cur=n.id; }
    changed=true;
  }
  return changed;
}
async function pull(first){
  if(!cloud.col) return;
  cloud.lastPull=Date.now();
  const [meta,qs]=await Promise.all([cloud.base.get(),cloud.col.get()]);
  const before=Object.values(db.matches).reduce((a,m)=>a+m.ev.length,0);
  const changed=applyCloud(qs.docs,meta.exists?meta.data():null);
  if(changed){
    try{ localStorage.setItem(KEY,JSON.stringify(db)); }catch(e){}
    resetSel(); flash=null; renderAll();
    const after=Object.values(db.matches).reduce((a,m)=>a+m.ev.length,0);
    if(first&&after>before) toast(`Dati recuperati dal tuo account: ${att(after)}.`);
  }
}
async function initCloud(){
  try{
    const c=window.claude; if(!c||typeof c.use!=='function') return;
    const [dbx,ux]=await Promise.all([c.use('db'),c.use('user')]);
    if(!dbx||!ux) return;
    const uid=await ux.id(); if(!uid) return;
    cloud.base=dbx.doc('data/users/'+uid+'/scout');
    cloud.col=cloud.base.collection('matches');
    cloud.state='loading'; renderCloudBits();
    await pull(true);
    cloud.state='on'; renderCloudBits();
    scheduleSync();
  }catch(e){
    const code=e&&e.code;
    cloud.state=(code==='unavailable'||code==='resource_exhausted')?'error':'off';
    renderCloudBits();
    if(cloud.state==='error') setTimeout(initCloud,8000);
  }
}
async function syncNow(){
  if(cloud.state!=='on') return;
  if(cloud.busy){ cloud.again=true; return; }
  cloud.busy=true;
  try{
    for(const m of Object.values(db.matches)){
      if(isPristine(m)) continue;
      const body=toCloud(m), sig=JSON.stringify(body);
      if(cloud.pushed[m.id]===sig) continue;
      await cloud.col.doc(m.id).set(body);
      cloud.pushed[m.id]=sig;
    }
    for(const id of db.deleted.concat([...cloud.drop])){
      if(cloud.pushed[id]===undefined&&!cloud.drop.has(id)) continue;
      await cloud.col.doc(id).delete();
      delete cloud.pushed[id]; cloud.drop.delete(id);
    }
    const meta=metaOf(), ms=JSON.stringify(meta);
    const hasMeta=db.deleted.length||db.team.pl.length||db.team.name;
    if(ms!==cloud.metaSig&&(hasMeta||cloud.metaSig)){ await cloud.base.set(JSON.parse(ms)); cloud.metaSig=ms; }
    if(cloud.fail){ cloud.fail=0; renderCloudBits(); }
  }catch(e){
    const code=e&&e.code;
    if(['revoked','not_granted','capability_disabled','capability_removed'].includes(code)){ cloud.state='off'; }
    else if(code==='quota_exceeded'){ if(!cloud.quotaWarned){ cloud.quotaWarned=true; toast('Spazio online pieno: elimina qualche partita vecchia. I dati restano su questo dispositivo.'); } }
    else{ cloud.fail++; setTimeout(scheduleSync,Math.min(30000,2000*cloud.fail)); }
    renderCloudBits();
  }finally{
    cloud.busy=false;
    if(cloud.again){ cloud.again=false; scheduleSync(); }
  }
}

/* ---------- statistiche ---------- */
function aggregate(evs){
  const P={}, T={};
  const mk=x=>Object.assign({t:0,K:0,D:0,B:0,E:0},x);
  const bump=(o,e)=>{ o.t++; o[e.o]++; };
  evs.forEach(e=>{
    const p=P[e.n]||(P[e.n]=mk({n:e.n,sh:{}}));
    bump(p,e);
    const k=e.z+e.d;
    bump(p.sh[k]||(p.sh[k]=mk({z:e.z,d:e.d})),e);
    bump(T[k]||(T[k]=mk({z:e.z,d:e.d})),e);
  });
  const players=Object.values(P).map(p=>Object.assign(p,{kp:p.K/p.t,eff:(p.K-p.E-p.B)/p.t,dp:p.D/p.t}));
  return {players,team:T};
}
const totals=evs=>evs.reduce((a,e)=>(a.t++,a[e.o]++,a),{t:0,K:0,D:0,B:0,E:0});
const byUse=(a,b)=>b.t-a.t||b.K-a.K;
const byKill=(a,b)=>b.K-a.K||(b.K/b.t)-(a.K/a.t)||b.t-a.t;
const topShot=p=>Object.values(p.sh).sort(byUse)[0]||null;
const topKill=p=>Object.values(p.sh).filter(s=>s.K>0).sort(byKill)[0]||null;
const tipCount=p=>Object.values(p.sh).filter(s=>s.d==='T').reduce((a,s)=>a+s.t,0);
const lossOf=s=>s.E+s.B;
const worstShot=p=>Object.values(p.sh).filter(s=>s.t>=2&&lossOf(s)>=2).sort((a,b)=>lossOf(b)/b.t-lossOf(a)/a.t||b.t-a.t)[0]||null;

function defense(z,d){
  if(isC(d)) return z==='3'?'zona '+d+' pronta sul primo tempo':'zona '+d+' pronta sull’attacco da dietro';
  if(d==='T') return 'una giocatrice corta dietro il muro';
  if(z==='4') return d==='D'?'zona 5 pronta sulla diagonale':'zona 1 pronta sulla parallela';
  if(z==='2') return d==='D'?'zona 1 pronta sulla diagonale':'zona 5 pronta sulla parallela';
  return d==='L'?'zona 6 pronta in fondo al centro':'zone 1 e 5 pronte sulle diagonali';
}
function blockTip(z,d){ if(isC(d)) return z==='3'?'il nostro centrale chiuda verso zona '+d:z==='P'?'il centrale segua la pipe e chiuda verso zona '+d:'chiudete verso zona '+d; if(d==='T'||z==='3'||z==='P') return ''; return d==='D'?'toglietele la diagonale':'chiudete la parallela'; }

/* dove cade la palla nel campo di chi difende: corta (C) o zone 1/6/5 */
function landing(z,d){
  if(d==='T') return [['C',1]];
  if(isC(d)) return [[d,1]];
  if(z==='4') return [[d==='D'?'5':'1',1]];
  if(z==='2') return [[d==='D'?'1':'5',1]];
  if(d==='L') return [['6',1]];
  return [['1',.5],['5',.5]];   // diagonale da 3 o pipe in diagonale (versioni vecchie)
}
const CELLS=['C','1','6','5'];
const cellName=c=>c==='C'?'corta dietro il muro':'zona '+c;
function heat(evs){
  const H={}; CELLS.forEach(c=>{ H[c]={c,t:0,K:0}; });
  evs.forEach(e=>{ landing(e.z,e.d).forEach(([c,w])=>{ H[c].t+=w; if(e.o==='K') H[c].K+=w; }); });
  return H;
}
const rnd=v=>Math.round(v*10)/10;
const fmtN=v=>String(rnd(v)).replace('.',',');

function insightsL(evs){
  const A=aggregate(evs);
  const named=A.players.filter(p=>p.n!=='?');
  const threats=named.filter(p=>p.t>=3&&p.K>=1).sort((a,b)=>b.K-a.K||b.kp-a.kp||b.t-a.t).slice(0,3);
  const tset=new Set(threats.map(p=>p.n));
  const notes=[];
  named.filter(p=>p.t>=4&&!tset.has(p.n)).forEach(p=>{
    const s=topShot(p), tips=tipCount(p);
    const weak=p.eff<=0, pred=!!(s&&s.t/p.t>=.45), tipHeavy=tips>=2&&tips/p.t>=.25;
    if(!weak&&!pred&&!tipHeavy) return;
    const parts=[];
    if(weak) parts.push(`Efficienza ${spct(p.eff)}: ${pts(p.K)} e ${p.E+p.B} tra errori e murate su ${att(p.t)}.`);
    if(pred) parts.push(`${s.t} attacchi su ${p.t} sono ${shotName(s.z,s.d)}. Difesa: ${defense(s.z,s.d)}.`);
    if(tipHeavy&&!(pred&&s.d==='T')) parts.push(`${tips} pallonetti su ${p.t}: serve una giocatrice corta dietro il muro.`);
    if(weak) parts.push('Si può tenerla con il muro a uno e aiutare sulle altre.');
    const kind=weak?'weak':tipHeavy?'tip':'pred';
    notes.push({kind,n:p.n,head:weak?'Rende poco':tipHeavy?'Usa molto il pallonetto':'Prevedibile',text:parts.join(' ')});
  });
  const ord={pred:0,tip:1,weak:2};
  notes.sort((a,b)=>ord[a.kind]-ord[b.kind]);
  const costly=Object.values(A.team).filter(s=>s.K>0).sort(byKill).slice(0,3);
  return {A,threats,notes,costly};
}
function threatFacts(p){
  const f=[], k=topKill(p), u=topShot(p), tips=tipCount(p);
  if(k){
    f.push(['Dove fa punto',`${shotName(k.z,k.d)} (${k.K}${NB}su${NB}${k.t})`]);
    f.push(['Difesa',defense(k.z,k.d)]);
    const b=blockTip(k.z,k.d); if(b) f.push(['Muro',b]);
  }
  if(u&&(!k||u.z!==k.z||u.d!==k.d)) f.push(['Colpo più usato',`${shotName(u.z,u.d)} (${u.t}${NB}${plural(u.t,'volta','volte')})`]);
  if(tips>=2&&tips/p.t>=.25&&!(k&&k.d==='T')) f.push(['Pallonetto',`${tips} su ${p.t}: serve una giocatrice corta dietro il muro`]);
  if(p.K&&p.kp<.35) f.push(['Nota',`fa punti per quantità, va a segno il ${pct(p.kp)} delle volte`]);
  return f;
}
function insightsN(evs){
  const A=aggregate(evs);
  const named=A.players.filter(p=>p.n!=='?');
  const best=named.filter(p=>p.t>=3&&p.K>=1).sort((a,b)=>b.K-a.K||b.kp-a.kp||b.t-a.t).slice(0,3);
  const shots=Object.values(A.team);
  const work=shots.filter(s=>s.t>=3&&s.K/s.t>=.4).sort((a,b)=>b.K/b.t-a.K/a.t||b.t-a.t).slice(0,3);
  const avoid=shots.filter(s=>s.t>=3&&lossOf(s)/s.t>=.4).sort((a,b)=>lossOf(b)/b.t-lossOf(a)/a.t||b.t-a.t).slice(0,3);
  const struggling=named.filter(p=>p.t>=4&&p.eff<0).sort((a,b)=>a.eff-b.eff).slice(0,3);
  return {A,best,work,avoid,struggling};
}
function usFacts(p){
  const f=[], k=topKill(p), w=worstShot(p), u=topShot(p);
  if(k){ f.push(['Funziona',`${shotName(k.z,k.d)} (${k.K}${NB}su${NB}${k.t})`]); f.push(['Cade in',cellName(landing(k.z,k.d)[0][0])]); }

}

const GO={'4':[37,110],'3':[80,110],'2':[123,110],'P':[80,141],'1':[123,141]};
const GT={'4L':[[27,27]],'4D':[[131,34]],'2L':[[133,27]],'2D':[[29,34]],'3L':[[76,25]],'31':[[35,38]],'35':[[125,38]],'P1':[[36,33]],'P6':[[80,27]],'P5':[[124,33]],'11':[[34,30]],'16':[[84,27]],'15':[[123,25]],'3D':[[33,40],[127,40]],'PL':[[85,31]],'PD':[[40,47],[120,47]],'4T':[[55,84]],'3T':[[80,81]],'2T':[[105,84]],'PT':[[80,74]]};
const f1=v=>Math.round(v*10)/10;
// colore delle frecce: per i loro attacchi rosso = ci fanno male; per i nostri verde = funziona
function dcol(s,side){ const r=s.K/s.t; if(side==='N') return r>=.5?'var(--green)':r>=.25?'var(--warn)':'var(--slate)'; return r>=.5?'var(--red)':r>=.25?'var(--warn)':'var(--calm)'; }
function arrow(x1,y1,x2,y2,w,col){
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L;
  const hl=4.5+w*1.15, hw=2.6+w*.95, bx=x2-ux*hl, by=y2-uy*hl, px=-uy, py=ux;
  return `<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(bx)}" y2="${f1(by)}" style="stroke:${col};stroke-width:${f1(w)};stroke-linecap:round"/><polygon points="${f1(x2)},${f1(y2)} ${f1(bx+px*hw)},${f1(by+py*hw)} ${f1(bx-px*hw)},${f1(by-py*hw)}" style="fill:${col}"/>`;
}
function diagram(shots,label,side){
  side=side||'L';
  const list=Object.values(shots||{}).filter(s=>s.t>0).sort((a,b)=>a.t-b.t);
  const max=list.reduce((a,s)=>Math.max(a,s.t),1);
  const used=new Set(list.map(s=>s.z));
  let g='';
  list.forEach(s=>{
    const r=s.t/max, col=dcol(s,side), o=GO[s.z], tg=GT[s.z+s.d]; if(!o||!tg) return;
    if(s.d==='T'){
      const t=tg[0], cx=(o[0]+t[0])/2, cy=Math.min(o[1],t[1])-20;
      g+=`<path d="M${o[0]} ${o[1]}Q${f1(cx)} ${f1(cy)} ${t[0]} ${t[1]}" style="stroke:${col};stroke-width:${f1(1.2+1.6*r)};fill:none;stroke-dasharray:2.4 2.4;stroke-linecap:round"/><circle cx="${t[0]}" cy="${t[1]}" r="${f1(2.8+3.8*r)}" style="fill:${col};stroke:var(--d-fill);stroke-width:1.4"/>`;
    }else{
      const w=(1.5+4.5*r)*(tg.length>1?.8:1);
      tg.forEach(t=>{ g+=arrow(o[0],o[1],t[0],t[1],w,col); });
    }
  });
  const org=(z,t)=>{ const p=GO[z], on=used.has(z)?' on':''; return z==='P'
    ?`<g class="org${on}"><rect x="${p[0]-13}" y="${p[1]-6.5}" width="26" height="13" rx="6.5"/><text x="${p[0]}" y="${p[1]+2.9}">pipe</text></g>`
    :`<g class="org${on}"><circle cx="${p[0]}" cy="${p[1]}" r="7"/><text x="${p[0]}" y="${p[1]+2.9}">${t}</text></g>`; };
  const top=side==='N'?'loro':'noi', bot=side==='N'?'noi':'loro';
  return `<svg class="dg-svg" viewBox="0 0 160 166" role="img" aria-label="${esc(label||'Campo')}"><text class="dz" x="37" y="10">zona 1</text><text class="dz" x="80" y="10">zona 6</text><text class="dz" x="123" y="10">zona 5</text><text class="side" transform="translate(8.5 56) rotate(-90)">${top}</text><text class="side" transform="translate(8.5 128) rotate(-90)">${bot}</text><rect class="dour" x="16" y="15" width="128" height="81"/><line class="dln" x1="16" y1="69" x2="144" y2="69"/><rect class="dthr" x="16" y="96" width="128" height="64"/><line class="dln" x1="16" y1="123" x2="144" y2="123"/><line class="dnet" x1="10" y1="96" x2="150" y2="96"/>${g}${org('4','4')}${org('3','3')}${org('2','2')}${org('P')}${org('1','1')}</svg>`;
}

/* campo intero per il confronto: sopra il loro campo (dove facciamo punto noi), sotto il nostro (dove fanno punto loro) */
function heatCourt(HN,HL){
  const X0=10, W=160, Y0=10, H=320, NET=Y0+H/2, third=W/3, m3=H/2/3;
  const cell=(x,y,w,h,c,data,good)=>{
    const t=data.t, r=t?data.K/t:0, base=good?'var(--green)':'var(--red)';
    const mix=t?Math.round(14+72*r):0;
    const fill=t?`color-mix(in srgb, ${base} ${mix}%, var(--surface-2))`:'var(--surface-2)';
    const ink=mix>=48?'#fff':'var(--ink)', sub=mix>=48?'rgba(255,255,255,.85)':'var(--muted)';
    const cx=x+w/2, cy=y+h/2;
    return `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" style="fill:${fill}"/>`
      +`<text class="hz" x="${f1(cx)}" y="${f1(cy-(t?13:2))}" style="fill:${sub}">${c==='C'?'corta':'zona '+c}</text>`
      +(t?`<text class="hk" x="${f1(cx)}" y="${f1(cy+4)}" style="fill:${ink}">${fmtN(data.K)}/${fmtN(t)}</text><text class="hp" x="${f1(cx)}" y="${f1(cy+15)}" style="fill:${sub}">${pct(r)}</text>`:`<text class="hp" x="${f1(cx)}" y="${f1(cy+10)}" style="fill:${sub}">nessuno</text>`);
  };
  let g='';
  // loro campo, visto dalla nostra panchina: fondo in alto 1-6-5, corta vicino alla rete
  const topBackH=H/2-m3, bottomBackY=NET+m3;
  [['1',0],['6',1],['5',2]].forEach(([c,i])=>{ g+=cell(X0+i*third,Y0,third,topBackH,c,HN[c],true); });
  g+=cell(X0,Y0+topBackH,W,m3,'C',HN.C,true);
  // il nostro campo: corta vicino alla rete, fondo in basso 5-6-1
  g+=cell(X0,NET,W,m3,'C',HL.C,false);
  [['5',0],['6',1],['1',2]].forEach(([c,i])=>{ g+=cell(X0+i*third,bottomBackY,third,H/2-m3,c,HL[c],false); });
  const lines=`<rect x="${X0}" y="${Y0}" width="${W}" height="${H}" style="fill:none;stroke:var(--line-2);stroke-width:1.5"/>`
    +`<line x1="${X0}" y1="${f1(Y0+topBackH)}" x2="${X0+W}" y2="${f1(Y0+topBackH)}" style="stroke:var(--surface);stroke-width:1.5"/>`
    +`<line x1="${X0}" y1="${f1(bottomBackY)}" x2="${X0+W}" y2="${f1(bottomBackY)}" style="stroke:var(--surface);stroke-width:1.5"/>`
    +[1,2].map(i=>`<line x1="${f1(X0+i*third)}" y1="${Y0}" x2="${f1(X0+i*third)}" y2="${f1(Y0+topBackH)}" style="stroke:var(--surface);stroke-width:1.5"/><line x1="${f1(X0+i*third)}" y1="${f1(bottomBackY)}" x2="${f1(X0+i*third)}" y2="${Y0+H}" style="stroke:var(--surface);stroke-width:1.5"/>`).join('')
    +`<line x1="2" y1="${NET}" x2="178" y2="${NET}" style="stroke:var(--d-net);stroke-width:3;stroke-linecap:round"/>`;
  return `<svg class="heat" viewBox="0 0 180 340" role="img" aria-label="Campo: in alto dove facciamo punto nel loro campo, in basso dove fanno punto nel nostro">${g}${lines}</svg>`;
}

function flyBall(btn,e){
  if(reduced||!btn||!btn.animate) return;
  try{
    const r=btn.getBoundingClientRect(), c=$('#court').getBoundingClientRect(); if(!r.width) return;
    const x0=r.left+r.width/2, y0=r.top+r.height/2;
    const dir=isC(e.d)?(e.d==='1'?-1:e.d==='5'?1:(e.z==='1'?-.4:0)):e.d==='D'?(e.z==='4'?1:e.z==='2'?-1:0):0;
    const x1=Math.min(c.right-16,Math.max(c.left+16,x0+dir*Math.min(120,c.width*.3))), y1=c.top-26;
    const tip=e.d==='T', mx=(x0+x1)/2, my=Math.min(y0,y1)-(tip?46:14);
    const el=document.createElement('div'); el.className='fly'; el.innerHTML=BALL; el.style.setProperty('--c',OUT[e.p][e.o].c);
    document.body.appendChild(el);
    const T=(x,y,sc,rt)=>`translate(${x-12}px,${y-12}px) scale(${sc}) rotate(${rt}deg)`;
    el.animate([{transform:T(x0,y0,.6,0),opacity:.2},{transform:T(mx,my,1.05,200),opacity:1,offset:.55},{transform:T(x1,y1,.75,380),opacity:0}],{duration:tip?640:460,easing:'cubic-bezier(.25,.7,.35,1)'}).onfinish=()=>el.remove();
    setTimeout(()=>{ if(el.isConnected) el.remove(); },1200);
  }catch(err){}
}

function briefPending(m){
  if(m.ev.some(e=>e.s===m.set)) return null;
  if(m.set===5&&sideEv(m.ev,'L').length>=8) return 'tb';
  const prev=m.ev.filter(e=>e.s<m.set).reduce((a,e)=>Math.max(a,e.s),0);
  return prev&&m.ev.filter(e=>e.s===prev).length>=4?prev:null;
}
function removeEvent(mid,id){ const m=db.matches[mid]; if(!m) return false; const i=m.ev.findIndex(x=>x.id===id); if(i<0) return false; const q=qids(m.ev).get(m.ev[i]); m.ev.splice(i,1); m.gone=m.gone.filter(g=>g!==id&&g!==q).concat(id===q?[id]:[id,q]).slice(-1000); save(); return true; }
function restoreEvent(mid,e){ const m=db.matches[mid]; if(!m||m.ev.some(x=>x.id===e.id)) return false; const q=qids(m.ev.concat([e])).get(e); m.gone=m.gone.filter(g=>g!==e.id&&g!==q); m.ev.push(e); m.ev.sort((a,b)=>a.t-b.t); save(); return true; }

function undoLast(){

    if(removeEvent(m.id,ev.id)){ renderJerseys(); renderCourtState(); renderFeed(); setFlash('removed',ev,m.id,false); }
    return;
  }

}

/* tastiera (PC) */
let kbuf='', kbufT=0;
function typedNumber(k){
  const nums=jerseyNums();
  kbuf=(kbuf+k).slice(-3);
  let cands=nums.filter(n=>n.startsWith(kbuf));
  if(!cands.length){ kbuf=k; cands=nums.filter(n=>n.startsWith(kbuf)); }
  clearTimeout(kbufT);
  if(!cands.length){ kbuf=''; toast(`Il numero ${k} non è in ${side()==='N'?'squadra':'rosa'}.`); return; }
  const exact=cands.includes(kbuf);
  if(exact&&cands.length===1){ pickNum(kbuf); kbuf=''; return; }
  // c'è un numero più lungo che inizia così (es. 1 e 12): aspetto un attimo prima di decidere
  const pending=kbuf;
  kbufT=setTimeout(()=>{ if(exact&&jerseyNums().includes(pending)) pickNum(pending); kbuf=''; },650);
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!$('#scrim').hidden){ closeSheet(); return; }
    if(view==='scout'&&(sel.n||sel.z||sel.o)) clearSel();
    return;
  }
  if(!$('#scrim').hidden||view!=='scout') return;
  const t=e.target; if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&e.key.toLowerCase()==='z'){ e.preventDefault(); undoLast(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey||e.repeat) return;
  const k=e.key;
  if(/^\d$/.test(k)){ e.preventDefault(); typedNumber(k); return; }
  if(k==='?'){ e.preventDefault(); pickNum('?'); return; }
  const lk=k.toLowerCase();
  if(KEYOUT[lk]){ e.preventDefault(); pickOut(KEYOUT[lk]); return; }
  if(lk==='l'||lk==='n'){ e.preventDefault(); setSide(lk==='l'?'L':'N'); }
});

let asub=null;   // 'L' | 'N' | 'X'

function playerCard(p,s,rank){

  const rkTxt=rank?(s==='N'?['La più efficace','Seconda per punti','Terza per punti']:['La più pericolosa','Seconda minaccia','Terza minaccia'])[rank-1]:'';

    +(facts.length?`<dl class="facts">${facts.map(f=>`<div><dt>${esc(f[0])}</dt><dd>${esc(cap(f[1]))}</dd></div>`).join('')}</dl>`:'')
    +(p.t<5?`<p class="caveat">Solo ${att(p.t)}: aspetta altri dati prima di decidere.</p>`:'')+`</article>`;

function kpiStrip(evs,s){

  if(s==='N') return `<div class="kpis"><div class="kpi"><b class="num">${T.t}</b><span>attacchi nostri</span></div><div class="kpi"><b class="num good">${pct(k)}</b><span>a punto, ${pts(T.K)}</span></div><div class="kpi"><b class="num">${spct(eff)}</b><span>efficienza</span></div><div class="kpi"><b class="num">${T.E+T.B}</b><span>errori e murate subite</span></div></div>`;
  return `<div class="kpis"><div class="kpi"><b class="num">${T.t}</b><span>attacchi loro</span></div><div class="kpi"><b class="num bad">${pct(k)}</b><span>a punto, ${pts(T.K)}</span></div><div class="kpi"><b class="num">${spct(eff)}</b><span>loro efficienza</span></div><div class="kpi"><b class="num good">${pct(T.t?(T.D+T.B)/T.t:0)}</b><span>tenuti in gioco o murati da noi</span></div></div>`;
}
const todoItem=(tag,head,text,col)=>`<li style="--tc:${col}"><div><b>${tag?`<span class="tg">${esc(tag)}</span>`:''}${esc(head)}</b><p>${esc(text)}</p></div></li>`;
function analysisL(evs){
  const I=insightsL(evs);
  if(!I.A.players.some(p=>p.n!=='?'&&p.t>=3)) return emptyState('Servono più attacchi','I consigli arrivano quando un’avversaria ha almeno 3 attacchi segnati.');
  let h=kpiStrip(evs,'L');
  const todo=[];
  I.threats.slice(0,2).forEach(p=>{ const k=topKill(p); if(k){ const b=blockTip(k.z,k.d); todo.push(todoItem('#'+p.n,`Fa punto ${shotName(k.z,k.d)}`,`${cap(defense(k.z,k.d))}.${b?' Muro: '+b+'.':''}`,'var(--red)')); } });
  const H=heat(evs), hl=hole(H);
  if(hl) todo.push(todoItem('',`Coprite ${cellName(hl.c)}`,`Lì ci fanno ${fmtN(hl.K)} punti su ${fmtN(hl.t)} attacchi.`,'var(--warn)'));
  const weak=I.notes.find(n=>n.kind==='weak'); if(weak) todo.push(todoItem('#'+weak.n,'La teniamo','Muro a uno su di lei e aiuti sulle altre.','var(--green)'));
  if(todo.length) h+=`<h2 class="sech">Cosa fare</h2><ul class="todo">${todo.slice(0,4).join('')}</ul>`;
  const rank=new Map(I.threats.map((p,i)=>[p.n,i+1]));
  const ps=I.A.players.slice().sort((a,b)=>(rank.get(a.n)||9)-(rank.get(b.n)||9)||(a.n==='?')-(b.n==='?')||b.t-a.t||b.K-a.K);
  h+=`<h2 class="sech">Le avversarie<small>In ordine di pericolo. Le frecce partono da dove attaccano e finiscono dove tirano.</small></h2>${outLegend('L')}${arrowLegend('L')}<div class="pgrid">${ps.map(p=>playerCard(p,'L',rank.get(p.n))).join('')}</div>`;
  if(I.notes.length) h+=`<h2 class="sech">Da tenere d'occhio</h2><ul class="todo">${I.notes.map(n=>todoItem('#'+n.n,n.head,n.text,n.kind==='weak'?'var(--green)':n.kind==='tip'?'var(--warn)':'var(--steel)')).join('')}</ul>`;
  if(I.costly.length) h+=`<h2 class="sech">Colpi che ci costano di più</h2><div class="teamblk" style="--kc:var(--red)"><div class="dg">${diagram(I.A.team,'Tutti gli attacchi avversari','L')}</div><ul class="costly">${I.costly.map(x=>`<li><span class="k num">${x.K}</span><span>${esc(cap(shotName(x.z,x.d)))}<small>${pts(x.K)} su ${x.t}. Difesa: ${esc(defense(x.z,x.d))}</small></span></li>`).join('')}</ul></div>`;
  h+=tableHTML(I.A.players,'L');
  return h;
}
function analysisN(evs){
  const I=insightsN(evs);
  if(!evs.length) return emptyState('Nessun attacco vostro','Nello scout tocca “Attacchiamo noi” e segna i vostri attacchi come fai con le avversarie.','Segna i nostri attacchi');
  if(!I.A.players.some(p=>p.t>=3)) return kpiStrip(evs,'N')+emptyState('Servono più attacchi','I consigli arrivano quando una giocatrice ha almeno 3 attacchi segnati.');
  let h=kpiStrip(evs,'N');
  const todo=[];
  const H=heat(evs), hl=hole(H);
  if(I.work[0]){ const w=I.work[0]; todo.push(todoItem('','Insistete: '+shotName(w.z,w.d),`${w.K} punti su ${w.t}. Lì non ci leggono.`,'var(--green)')); }
  if(hl) todo.push(todoItem('',`Cercate ${cellName(hl.c)}`,`È il loro buco: ${fmtN(hl.K)} punti su ${fmtN(hl.t)} attacchi.`,'var(--green)'));
  if(I.best[0]){ const p=I.best[0]; todo.push(todoItem(who(p.n,'N'),'Palla a lei',`${pts(p.K)} su ${att(p.t)}, ${pct(p.kp)} a segno.`,'var(--steel)')); }
  if(I.avoid[0]){ const a=I.avoid[0]; todo.push(todoItem('','Evitate: '+shotName(a.z,a.d),`${lossOf(a)} tra errori e murate su ${a.t}.`,'var(--red)')); }
  if(todo.length) h+=`<h2 class="sech">Cosa fare</h2><ul class="todo">${todo.slice(0,4).join('')}</ul>`;
  const rank=new Map(I.best.map((p,i)=>[p.n,i+1]));
  const ps=I.A.players.slice().sort((a,b)=>(rank.get(a.n)||9)-(rank.get(b.n)||9)||(a.n==='?')-(b.n==='?')||b.t-a.t);
  h+=`<h2 class="sech">Le nostre attaccanti<small>Le frecce mostrano dove tirate. Verde = lì fate punto.</small></h2>${outLegend('N')}${arrowLegend('N')}<div class="pgrid">${ps.map(p=>playerCard(p,'N',rank.get(p.n))).join('')}</div>`;
  if(I.struggling.length) h+=`<h2 class="sech">In difficoltà</h2><ul class="todo">${I.struggling.map(p=>{ const w=worstShot(p); return todoItem(who(p.n,'N'),`Efficienza ${spct(p.eff)}`,`${p.E} errori e ${p.B} murate su ${att(p.t)}.${w?' Soprattutto '+shotName(w.z,w.d)+'.':''}`,'var(--red)'); }).join('')}</ul>`;
  const shots=Object.values(I.A.team).sort(byKill).slice(0,4);
  if(shots.length) h+=`<h2 class="sech">Tutti i nostri colpi</h2><div class="teamblk" style="--kc:var(--green)"><div class="dg">${diagram(I.A.team,'Tutti i nostri attacchi','N')}</div><ul class="costly">${shots.map(x=>`<li><span class="k num">${x.K}</span><span>${esc(cap(shotName(x.z,x.d)))}<small>${pts(x.K)} su ${x.t}${lossOf(x)?`, ${lossOf(x)} tra errori e murate`:''}</small></span></li>`).join('')}</ul></div>`;
  h+=tableHTML(I.A.players,'N');
  return h;
}
function tableHTML(players,s){
  const all=players.slice().sort((a,b)=>b.K-a.K||b.kp-a.kp||b.t-a.t);
  const kc=s==='N'?'var(--green)':'var(--red)';
  return `<h2 class="sech">Tutte in tabella</h2><div class="tablewrap" style="--kc:${kc}"><table><thead><tr><th>N°</th><th>Attacchi</th><th>Punti</th><th>Eff.</th><th>${s==='N'?'Err. e murate':'Difese nostre'}</th></tr></thead><tbody>${all.map(p=>{ const pl=s==='N'?plOf(p.n):null; return `<tr><td><span class="jn num">${p.n==='?'?'?':esc(p.n)}</span>${pl&&pl.nm?`<span class="pn">${esc(pl.nm)}</span>`:''}</td><td class="tnum">${p.t}</td><td class="tnum${p.t>=3&&p.kp>=.5?' hot':''}">${p.K}<small>${pct(p.kp)}</small></td><td class="tnum">${spct(p.eff)}</td><td class="tnum">${s==='N'?(p.E+p.B):pct(p.dp)}</td></tr>`; }).join('')}</tbody></table></div><p class="tiny" style="margin:8px 2px 0">Accanto ai punti, la percentuale a segno. Efficienza = (punti − errori − murate) ÷ attacchi.</p>`;
}
function analysisX(evs){
  const L=sideEv(evs,'L'), N=sideEv(evs,'N');
  if(!L.length||!N.length) return emptyState('Servono entrambi i lati','Il confronto mette uno di fronte all’altro i loro attacchi e i vostri: segna almeno qualche attacco per parte.');
  const HN=heat(N), HL=heat(L), hN=hole(HN), hL=hole(HL);
  const tL=totals(L), tN=totals(N);
  let lines=[];
  if(hN) lines.push(todoItem('',`Attaccate verso ${cellName(hN.c)}`,`Nel loro campo è il punto debole: ${fmtN(hN.K)} punti su ${fmtN(hN.t)}.`,'var(--green)'));
  if(hL) lines.push(todoItem('',`Proteggete ${cellName(hL.c)}`,`Nel nostro campo è dove ci fanno più male: ${fmtN(hL.K)} punti su ${fmtN(hL.t)}.`,'var(--red)'));
  const dk=(tN.t?tN.K/tN.t:0)-(tL.t?tL.K/tL.t:0);
  lines.push(todoItem('',Math.abs(dk)<.05?'Attacco alla pari':dk>0?'Attacchiamo meglio noi':'Attaccano meglio loro',`Noi ${pct(tN.t?tN.K/tN.t:0)} a punto su ${att(tN.t)}, loro ${pct(tL.t?tL.K/tL.t:0)} su ${att(tL.t)}.`,'var(--steel)'));
  const sets=[...new Set(evs.map(e=>e.s))].sort((a,b)=>a-b);
  const row=s=>{ const l=totals(L.filter(e=>e.s===s)), n=totals(N.filter(e=>e.s===s)); const bar=(x,c)=>`<div class="cbar"><span style="width:${Math.round((x.t?x.K/x.t:0)*90)}px;--bc:${c}"></span><em class="tnum">${x.t?pct(x.K/x.t)+', '+x.K+'/'+x.t:'nessuno'}</em></div>`; return `<tr><td>Set ${s}</td><td>${bar(l,'var(--red)')}</td><td>${bar(n,'var(--green)')}</td></tr>`; };
  return `<div class="vs"><div class="heatwrap"><p class="heatcap" style="--hc:var(--green)"><i></i>Loro campo: dove facciamo punto noi<small>${att(tN.t)}</small></p>${heatCourt(HN,HL)}<p class="heatcap" style="--hc:var(--red)"><i></i>Nostro campo: dove fanno punto loro<small>${att(tL.t)}</small></p></div>`
    +`<div><h2 class="sech">Cosa ne viene fuori</h2><ul class="todo" style="grid-template-columns:1fr">${lines.join('')}</ul>`
    +(sets.length?`<h2 class="sech">Set per set<small>Percentuale di attacchi chiusi a punto.</small></h2><div class="tablewrap"><table class="sets-cmp"><thead><tr><th>Set</th><th>Loro</th><th>Noi</th></tr></thead><tbody>${sets.map(row).join('')}</tbody></table></div>`:'')
    +`<p class="tiny" style="margin:10px 2px 0">La zona d'arrivo si ricava dal colpo: diagonale da 4 cade in zona 5, parallela in zona 1, pallonetto corto dietro il muro, e così via.</p></div></div>`;
}
function renderAnalysis(){
  const box=$('#v-analysis'), evs=fEvents();
  const nL=sideEv(evs,'L').length, nN=sideEv(evs,'N').length;
  if(!asub) asub=(nN&&!nL)?'N':'L';
